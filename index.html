<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تیله بازی مهارتی</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body { 
            background-color: #111; margin: 0; padding: 0; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; font-family: sans-serif; color: white; overflow: hidden;
        }
        /* منوی اصلی بازی */
        #setupMenu {
            position: absolute; background-color: #3e2723;
            background-image: url('menu_bg.jpg'); 
            background-size: cover; background-position: center;
            image-rendering: crisp-edges;
            width: 100%; height: 100%; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 20; padding: 20px;
            direction: rtl;
        }
        #setupMenu::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.55); z-index: -1;
        }
        
        /* دکمه تنظیمات در بالاترین نقطه صفحه، گوشه سمت چپ */
        #gearBtn {
            position: absolute; top: 20px; left: 20px;
            background: rgba(33, 150, 243, 0.85); border: none; border-radius: 50%; 
            width: 48px; height: 52px; font-size: 22px; color: white; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.4); z-index: 25;
        }

        /* کادر ویدیوی دمو بازی */
        .promo-banner {
            width: 100%; max-width: 340px; height: 160px; border: 3px solid #ffeb3b;
            border-radius: 15px; margin-bottom: 30px; overflow: hidden; position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); background: #000;
        }
        .promo-slider {
            display: flex; width: 300%; height: 100%;
            animation: autoScrollVideo 12s infinite linear;
        }
        .promo-slider img { width: 33.33%; height: 100%; object-fit: cover; }
        
        @keyframes autoScrollVideo {
            0% { transform: translateX(0); }
            30% { transform: translateX(0); }
            33% { transform: translateX(33.33%); }
            63% { transform: translateX(33.33%); }
            66% { transform: translateX(66.66%); }
            96% { transform: translateX(66.66%); }
            100% { transform: translateX(0); }
        }

        #startBtn { 
            width: 100%; max-width: 340px; padding: 14px 20px; font-size: 19px; font-weight: bold;
            background: #4caf50; color: white; border: none; border-radius: 25px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4); text-align: center;
        }

        /* کشوی تنظیمات تصویری */
        .drawer-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 30; display: none;
        }
        .drawer {
            position: fixed; bottom: -100%; left: 0; width: 100%; max-height: 80vh;
            background: #222; border-radius: 25px 25px 0 0; padding: 20px; z-index: 31;
            transition: bottom 0.4s cubic-bezier(0.1, 1, 0.1, 1); overflow-y: auto; direction: rtl;
        }
        .drawer.open { bottom: 0; }
        .drawer-close {
            background: #e53935; border: none; color: white; padding: 6px 16px;
            border-radius: 15px; float: left; font-weight: bold; cursor: pointer; font-size: 14px;
        }

        .menu-row { margin: 15px 0; text-align: center; width: 100%; }
        .menu-row label { display: block; font-size: 16px; margin-bottom: 10px; font-weight: bold; color: #ffeb3b; }
        
        .scroll-container { 
            display: flex; overflow-x: auto; gap: 12px; padding: 10px 5px; width: 100%; scroll-behavior: smooth;
            touch-action: pan-x !important; -webkit-overflow-scrolling: touch;
        }
        .scroll-container::-webkit-scrollbar { display: none; }
        
        .scroll-item { 
            flex: 0 0 100px; border: 3px solid #555; border-radius: 12px; overflow: hidden; cursor: pointer; 
            position: relative; aspect-ratio: 1; box-shadow: 0 4px 8px rgba(0,0,0,0.4); transition: transform 0.2s; background: #2e7d32;
        }
        .scroll-item canvas { width: 100%; height: 100%; object-fit: cover; }
        .scroll-item.active { border-color: #4caf50; box-shadow: 0 0 15px #4caf50; }

        .grid-select { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 5px; }
        .grid-item { 
            border: 3px solid #555; border-radius: 8px; overflow: hidden; cursor: pointer; 
            position: relative; aspect-ratio: 1; box-shadow: 0 4px 6px rgba(0,0,0,0.3); background: #222;
            display: flex; align-items: center; justify-content: center;
        }
        .grid-item canvas { width: 100%; height: 100%; object-fit: cover; }
        .grid-item.active { border-color: #4caf50; box-shadow: 0 0 12px #4caf50; }
        
        .count-preview { font-size: 24px; font-weight: bold; color: #fff; text-shadow: 0 2px 4px #000; }

        #canvas { 
            border: 4px solid white; box-shadow: 0 0 15px rgba(0,0,0,0.5); display: none; touch-action: none; 
            image-rendering: crisp-edges; background-color: #222;
        }
        #info { margin-bottom: 5px; font-size: 18px; font-weight: bold; text-align: center; display: none; width: 100%; max-width: 400px; direction: rtl;}
        .stats-bar { display: flex; justify-content: space-around; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 10px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <!-- منوی اصلی بازی -->
    <div id="setupMenu">
        <!-- کلید تنظیمات در گوشه بالا سمت چپ -->
        <button id="gearBtn">⚙️</button>
        
        <!-- کادر اسکرول دمو بازی -->
        <div class="promo-banner">
            <div class="promo-slider">
                <img src="grass.jpg" alt="دمو ۱">
                <img src="asphalt.jpg" alt="دمو ۲">
                <img src="dirt.jpg" alt="دمو ۳">
            </div>
        </div>

        <!-- دکمه شروع خالص -->
        <button id="startBtn">شروع</button>
    </div>

    <div class="drawer-overlay" id="overlay"></div>

    <div class="drawer" id="settingsDrawer">
        <button class="drawer-close" id="closeDrawer">تایید ×</button>
        <h3 style="margin-top: 0; color: #ffeb3b;">تنظیمات مسابقه</h3>
        
        <div class="menu-row">
            <label>انتخاب زمین بازی (ورق بزنید ↔️):</label>
            <div class="scroll-container" id="groundGrid">
                <div class="scroll-item active" data-val="grass"><canvas id="pre_grass"></canvas></div>
                <div class="scroll-item" data-val="carpet"><canvas id="pre_carpet"></canvas></div>
                <div class="scroll-item" data-val="asphalt"><canvas id="pre_asphalt"></canvas></div>
                <div class="scroll-item" data-val="cement"><canvas id="pre_cement"></canvas></div>
                <div class="scroll-item" data-val="dirt"><canvas id="pre_dirt"></canvas></div>
            </div>
        </div>

        <div class="menu-row">
            <label>شکل و تصویر تیله هدف:</label>
            <div class="grid-select" id="targetGrid">
                <div class="grid-item active" data-val="1.png"><canvas id="pre_t_red"></canvas></div>
                <div class="grid-item" data-val="2.png"><canvas id="pre_t_green"></canvas></div>
                <div class="grid-item" data-val="3.png"><canvas id="pre_t_gold"></canvas></div>
            </div>
        </div>

        <div class="menu-row">
            <label>تعداد تیله‌های داخل کادر:</label>
            <div class="grid-select" id="countGrid">
                <div class="grid-item active" data-val="3"><div class="count-preview">3</div></div>
                <div class="grid-item" data-val="5"><div class="count-preview">5</div></div>
                <div class="grid-item" data-val="7"><div class="count-preview">7</div></div>
            </div>
        </div>
    </div>

    <div id="info">
        <div class="stats-bar">
            <div>مرحله: <span id="lvlTxt">1</span></div>
            <div>شلیک باقی‌مانده: <span id="shotsTxt">3</span></div>
            <div>تیله‌های هدف: <span id="remTxt">3</span></div>
        </div>
        <div id="msg" style="color: #ffeb3b; font-size: 15px; text-align: center; display: none;">جایزه! ضربه دقیق بود، دوباره بزن 🎯</div>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const setupMenu = document.getElementById("setupMenu");
        const startBtn = document.getElementById("startBtn");
        const gearBtn = document.getElementById("gearBtn");
        const settingsDrawer = document.getElementById("settingsDrawer");
        const overlay = document.getElementById("overlay");
        const closeDrawer = document.getElementById("closeDrawer");

        const lvlTxt = document.getElementById("lvlTxt");
        const shotsTxt = document.getElementById("shotsTxt");
        const remTxt = document.getElementById("remTxt");
        const msgSlot = document.getElementById("msg");

        let currentLevel = 1;
        let shotsLeft = 3;
        let isAiming = false;
        let isMoving = false;
        let hitSuccessInTurn = false;
        
        let dragStart = { x: 0, y: 0 };
        let dragEnd = { x: 0, y: 0 };
        let windX = 0; 

        // کادر وسط زمین (ابعاد فیکس شده برای تناسب بهتر با نمای عمودی)
        const box = { x: 40, y: 70, w: 320, h: 220 };
        let player = { x: 200, y: 440, r: 24, vx: 0, vy: 0 }; 
        let targets = [];

        // مشخصات زمین‌ها، فیزیک اصطکاک و مدل خط‌کشی کادر دور هر کدام
        const grounds = {
            grass: { friction: 0.96, wind: 0.08, src: 'grass.jpg', borderStyle: 'rope', borderColor: '#ffffff', borderWidth: 4, fallbackColor: '#2e7d32' },
            carpet: { friction: 0.97, wind: 0.02, src: 'carpet.jpg', borderStyle: 'thread', borderColor: '#ffeb3b', borderWidth: 2, fallbackColor: '#b71c1c' },
            asphalt: { friction: 0.93, wind: 0.05, src: 'asphalt.jpg', borderStyle: 'chalk', borderColor: 'rgba(240,240,240,0.85)', borderWidth: 8, fallbackColor: '#424242' },
            cement: { friction: 0.98, wind: 0.04, src: 'cement.jpg', borderStyle: 'marker', borderColor: '#111111', borderWidth: 5, fallbackColor: '#9e9e9e' },
            dirt: { friction: 0.94, wind: 0.15, src: 'dirt.jpg', borderStyle: 'scratched', borderColor: '#4e342e', borderWidth: 6, fallbackColor: '#8d6e63' }
        };

        let currentGround = grounds.grass;
        let imgBg = new Image();
        
        let imgPlayer = new Image();
        imgPlayer.src = '6.png'; 
        
        let imgTarget = new Image();

        let selectedGroundVal = "grass";
        let selectedTargetSrc = "1.png"; 
        let selectedCountVal = 3;

        // تنظیم رزولوشن فیکس عمودی موبایل برای باز شدن فضای پرتاب تیرکمانی در پایین
        function resizeCanvas() {
            canvas.width = 400;
            canvas.height = 560;
            
            // قرار دادن تیله بزرگ درست در کف زمین برای باز کردن فضای شلیک چشمی
            player.x = canvas.width / 2;
            player.y = canvas.height - 50;

            box.x = (canvas.width - box.w) / 2;
        }

        function generateMenuPreviews() {
            setupMenu.style.backgroundImage = "url('menu_bg.jpg')";
            
            let applyImgToGrid = (id, src, fallbackColor) => {
                let cnv = document.getElementById(id);
                if(cnv) {
                    let cCtx = cnv.getContext("2d");
                    cnv.width = 100; cnv.height = 100;
                    let img = new Image();
                    img.src = src;
                    img.onload = () => { cCtx.drawImage(img, 0, 0, 100, 100); };
                    img.onerror = () => { cCtx.fillStyle = fallbackColor || "#333"; cCtx.fillRect(0, 0, 100, 100); };
                }
            };
            
            applyImgToGrid("pre_grass", "grass.jpg", "#2e7d32");
            applyImgToGrid("pre_carpet", "carpet.jpg", "#b71c1c");
            applyImgToGrid("pre_asphalt", "asphalt.jpg", "#424242");
            applyImgToGrid("pre_cement", "cement.jpg", "#9e9e9e");
            applyImgToGrid("pre_dirt", "dirt.jpg", "#8d6e63");
            
            applyImgToGrid("pre_t_red", "1.png", "#e53935");
            applyImgToGrid("pre_t_green", "2.png", "#2e7d32");
            applyImgToGrid("pre_t_gold", "3.png", "#ffb300");
        }

        function setupGridSelection(gridId, isScroll, callback) {
            const className = isScroll ? ".scroll-item" : ".grid-item";
            const items = document.querySelectorAll(`#${gridId} ${className}`);
            items.forEach(item => {
                item.addEventListener("click", () => {
                    let activeItem = document.querySelector(`#${gridId} ${className}.active`);
                    if(activeItem) activeItem.classList.remove("active");
                    item.classList.add("active");
                    callback(item.getAttribute("data-val"));
                });
            });
        }

        gearBtn.addEventListener("click", () => {
            settingsDrawer.classList.add("open");
            overlay.style.display = "block";
        });
        closeDrawer.addEventListener("click", () => {
            settingsDrawer.classList.remove("open");
            overlay.style.display = "none";
        });
        overlay.addEventListener("click", () => {
            settingsDrawer.classList.remove("open");
            overlay.style.display = "none";
        });

        window.addEventListener("DOMContentLoaded", () => {
            generateMenuPreviews();
            setupGridSelection("groundGrid", true, (val) => { selectedGroundVal = val; startBtn.innerText = "شروع"; });
            setupGridSelection("targetGrid", false, (val) => { selectedTargetSrc = val; startBtn.innerText = "شروع"; });
            setupGridSelection("countGrid", false, (val) => { selectedCountVal = parseInt(val); startBtn.innerText = "شروع"; });
        });

        startBtn.addEventListener("click", () => {
            // مکانیزم شیک انتخاب کاملاً تصادفی در صورت عدم دستکاری تنظیمات دستی
            if (startBtn.innerText === "شروع" && !document.querySelector('.drawer').classList.contains('manually-changed')) {
                // اگر دکمه مستقیما فشرده شد، یک حالت رندم اعمال کن
                const groundKeys = ["grass", "carpet", "asphalt", "cement", "dirt"];
                const targetKeys = ["1.png", "2.png", "3.png"];
                const countKeys =;
                
                selectedGroundVal = groundKeys[Math.floor(Math.random() * groundKeys.length)];
                selectedTargetSrc = targetKeys[Math.floor(Math.random() * targetKeys.length)];
                selectedCountVal = countKeys[Math.floor(Math.random() * countKeys.length)];
            }

            currentGround = grounds[selectedGroundVal];
            imgBg.src = currentGround.src;
            imgTarget.src = selectedTargetSrc;

            setupMenu.style.display = "none";
            canvas.style.display = "block";
            document.getElementById("info").style.display = "block";
            
            resizeCanvas(); 
            loadLevel(currentLevel);
        });

        // ردیابی تغییر دستی کاربر برای غیرفعال کردن سیستم رندم
        document.querySelectorAll('.drawer .scroll-item, .drawer .grid-item').forEach(el => {
            el.addEventListener('click', () => { document.querySelector('.drawer').classList.add('manually-changed'); });
        });

        function loadLevel(lvl) {
            player.x = canvas.width / 2;
            player.y = canvas.height - 50; 
            player.vx = 0; player.vy = 0;
            targets = [];
            
            let cx = box.x + box.w / 2;
            let cy = box.y + box.h / 2;
            
            if (selectedCountVal === 3) {
                shotsLeft = 4;
                targets.push({ x: cx, y: cy, r: 14, vx: 0, vy: 0, isOut: false });
                targets.push({ x: cx - 25, y: cy, r: 14, vx: 0, vy: 0, isOut: false });
                targets.push({ x: cx + 25, y: cy, r: 14, vx: 0, vy: 0, isOut: false });
            } else if (selectedCountVal === 5) {
                shotsLeft = 4;
                targets.push({ x: cx, y: cy, r: 14, vx: 0, vy: 0, isOut: false });
                targets.push({ x: cx - 28, y: cy, r: 14, vx: 0, vy: 0, isOut: false });
                targets.push({ x: cx + 28, y: cy, r: 14, vx: 0, vy: 0, isOut: false });
                targets.push({ x: cx, y: cy - 28, r: 14, vx: 0, vy: 0, isOut: false });
                targets.push({ x: cx, y: cy + 28, r: 14, vx: 0, vy: 0, isOut: false });
            } else { 
                shotsLeft = 5;
                targets.push({ x: cx, y: cy, r: 14, vx: 0, vy: 0, isOut: false });
                for(let i=1; i<=3; i++) {
                    targets.push({ x: cx - (i * 26), y: cy, r: 14, vx: 0, vy: 0, isOut: false });
                    targets.push({ x: cx + (i * 26), y: cy, r: 14, vx: 0, vy: 0, isOut: false });
                }
            }

            updateUI();
            if (lvl === 1) gameLoop();
        }

        function updateUI() {
            lvlTxt.innerText = currentLevel;
            shotsTxt.innerText = shotsLeft;
            remTxt.innerText = targets.filter(t => !t.isOut).length;
        }
        function resetRound() {
            player.x = canvas.width / 2;
            player.y = canvas.height - 50;
            player.vx = 0; player.vy = 0;
            windX = (Math.random() - 0.5) * currentGround.wind;
            isMoving = false;

            let activeTargets = targets.filter(t => !t.isOut).length;

            if (activeTargets === 0) {
                alert("آفرین! مرحله " + currentLevel + " را با موفقیت رد کردی! 🎉");
                currentLevel++;
                if (currentLevel > 5) {
                    alert("تبریک فراوان! شما تمام مراحل را با موفقیت تمام کردید و قهرمان کل بازی شدید! 🏆");
                    currentLevel = 1;
                    setupMenu.style.display = "flex";
                    canvas.style.display = "none";
                    document.getElementById("info").style.display = "none";
                    startBtn.innerText = "شروع";
                } else {
                    loadLevel(currentLevel);
                }
            } 
            else if (shotsLeft <= 0 && !hitSuccessInTurn) {
                alert("شلیک‌های شما در این مرحله تمام شد! دوباره تلاش کنید. ↩️");
                loadLevel(currentLevel);
            }

            hitSuccessInTurn = false;
            updateUI();
        }

        // نقاشی کادر اختصاصی تزیینی متناسب با جنس زمین بازی
        function drawDynamicBorder() {
            ctx.save();
            ctx.strokeStyle = currentGround.borderColor;
            ctx.lineWidth = currentGround.borderWidth;

            if (currentGround.borderStyle === 'chalk') {
                ctx.setLineDash([5, 15]); // خط گچی پهن و مقطع روی آسفالت
                ctx.shadowColor = "rgba(240,240,240,0.5)";
                ctx.shadowBlur = 4;
                ctx.strokeRect(box.x, box.y, box.w, box.h);
            } 
            else if (currentGround.borderStyle === 'marker') {
                ctx.setLineDash([]); // خط ماژیکی کاملاً ممتد و تیره روی سیمان
                ctx.strokeRect(box.x, box.y, box.w, box.h);
            } 
            else if (currentGround.borderStyle === 'scratched') {
                ctx.beginPath(); // خط نامنظم و تراشیده شده روی خاک با چوب
                let steps = 15;
                let stepW = box.w / steps; let stepH = box.h / steps;
                ctx.moveTo(box.x, box.y);
                for (let i = 1; i <= steps; i++) { ctx.lineTo(box.x + i * stepW, box.y + (Math.random() - 0.5) * 4); }
                for (let i = 1; i <= steps; i++) { ctx.lineTo(box.x + box.w + (Math.random() - 0.5) * 4, box.y + i * stepH); }
                for (let i = 1; i <= steps; i++) { ctx.lineTo(box.x + box.w - i * stepW, box.y + box.h + (Math.random() - 0.5) * 4); }
                for (let i = 1; i <= steps; i++) { ctx.lineTo(box.x + (Math.random() - 0.5) * 4, box.y + box.h - i * stepH); }
                ctx.closePath(); ctx.stroke();
            } 
            else {
                ctx.setLineDash([]);
                ctx.strokeRect(box.x, box.y, box.w, box.h);
            }
            ctx.restore();
            ctx.fillStyle = "rgba(0, 0, 0, 0.12)";
            ctx.fillRect(box.x, box.y, box.w, box.h);
        }

        function gameLoop() {
            let anyMoving = false;
            player.r = 24; 

            if (Math.abs(player.vx) > 0.05 || Math.abs(player.vy) > 0.05) {
                player.vx += windX; player.x += player.vx; player.y += player.vy;
                player.vx *= currentGround.friction; player.vy *= currentGround.friction; 
                anyMoving = true;
            } else { player.vx = 0; player.vy = 0; }

            targets.forEach(t => {
                if (!t.isOut) {
                    if (Math.abs(t.vx) > 0.05 || Math.abs(t.vy) > 0.05) {
                        t.x += t.vx; t.y += t.vy;
                        t.vx *= currentGround.friction; t.vy *= currentGround.friction;
                        anyMoving = true;
                    } else { t.vx = 0; t.vy = 0; }

                    let dx = t.x - player.x; let dy = t.y - player.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if (dist < player.r + t.r) {
                        let angle = Math.atan2(dy, dx);
                        let speed = Math.sqrt(player.vx*player.vx + player.vy*player.vy);
                        t.vx = Math.cos(angle) * speed * 0.85; t.vy = Math.sin(angle) * speed * 0.85;
                        player.vx *= -0.2; player.vy *= -0.2; 
                    }

                    if (t.x < box.x || t.x > box.x + box.w || t.y < box.y || t.y > box.y + box.h) {
                        t.isOut = true;
                        hitSuccessInTurn = true;
                    }
                }
            });

            if (isMoving && !anyMoving) {
                if (hitSuccessInTurn) {
                    msgSlot.style.display = "block";
                } else {
                    msgSlot.style.display = "none";
                    shotsLeft--; 
                }
                updateUI();
                setTimeout(resetRound, 400);
            }
            if (anyMoving) isMoving = true;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // ۱. تصویر زمین عمودی
            if (imgBg.complete && imgBg.naturalWidth !== 0) {
                ctx.drawImage(imgBg, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = currentGround.fallbackColor; ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // ۲. رسم خطوط دور کادر
            drawDynamicBorder();

            // ۳. خط نشانه‌گیری زرد کمرنگ
            if (isAiming) {
                ctx.beginPath(); ctx.moveTo(player.x, player.y);
                ctx.lineTo(player.x + (dragStart.x - dragEnd.x), player.y + (dragStart.y - dragEnd.y));
                ctx.strokeStyle = "rgba(255, 235, 59, 0.6)"; ctx.lineWidth = 3; ctx.stroke();
            }

            // ۴. رسم تصاویر خالص و دایره‌ای تیله‌های هدف (بدون کادر مستطیلی سفید دور تصویر)
            targets.forEach(t => {
                if (!t.isOut) {
                    if (imgTarget.complete && imgTarget.naturalWidth !== 0) {
                        ctx.save();
                        ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.clip();
                        ctx.drawImage(imgTarget, t.x - t.r, t.y - t.r, t.r * 2, t.r * 2);
                        ctx.restore();
                    } else {
                        ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI*2);
                        ctx.fillStyle = "red"; ctx.fill(); ctx.closePath();
                    }
                }
            });

            // ۵. رسم تصویر خالص دایره‌ای تیله دست بزرگ (6.png)
            if (imgPlayer.complete && imgPlayer.naturalWidth !== 0) {
                ctx.save();
                ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.clip();
                ctx.drawImage(imgPlayer, player.x - player.r, player.y - player.r, player.r * 2, player.r * 2);
                ctx.restore();
            } else {
                ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
                ctx.fillStyle = "#00d2ff"; ctx.fill(); ctx.closePath();
            }

            requestAnimationFrame(gameLoop);
        }

        function getEventPos(e) {
            let r = canvas.getBoundingClientRect();
            let clientX = e.touches ? e.touches.clientX : e.clientX;
            let clientY = e.touches ? e.touches.clientY : e.clientY;
            return {
                x: (clientX - r.left) * (canvas.width / r.width),
                y: (clientY - r.top) * (canvas.height / r.height)
            };
        }

        function handleStart(e) {
            if (isMoving || shotsLeft <= 0) return;
            let pos = getEventPos(e);
            let d = Math.sqrt(Math.pow(pos.x - player.x, 2) + Math.pow(pos.y - player.y, 2));
            if (d < player.r + 35) { 
                isAiming = true; dragStart.x = pos.x; dragStart.y = pos.y;
                dragEnd.x = pos.x; dragEnd.y = pos.y; msgSlot.style.display = "none"; 
            }
        }

        function handleMove(e) { if (!isAiming) return; let pos = getEventPos(e); dragEnd.x = pos.x; dragEnd.y = pos.y; }
        function handleEnd() { if (!isAiming) return; isAiming = false; player.vx = (dragStart.x - dragEnd.x) * 0.11; player.vy = (dragStart.y - dragEnd.y) * 0.11; }

        canvas.addEventListener("mousedown", handleStart); canvas.addEventListener("mousemove", handleMove); window.addEventListener("mouseup", handleEnd);
        canvas.addEventListener("touchstart", function(e) { e.preventDefault(); handleStart(e); }, { passive: false });
        canvas.addEventListener("touchmove", function(e) { e.preventDefault(); handleMove(e); }, { passive: false });
        window.addEventListener("touchend", handleEnd);
    </script>
</body>
