<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>تیله بازی نوستالژی استادیوم</title>
    <style>
        * { 
            box-sizing: border-box; 
            user-select: none; 
            -webkit-user-select: none; 
            margin: 0; padding: 0;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        body { 
            background-color: #111;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; 
            height: 100vh; height: -webkit-fill-available;
            font-family: sans-serif; color: white; overflow: hidden;
            touch-action: none;
        }
        /* 🖼️ استایل جذاب و شیشه‌ای صفحه لاگین مجهز به ردیف فیلدهای هوشمند پله‌ای */
        #loginScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #25252d 0%, #111116 100%);
            background-image: url('menu_bg.jpg');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            image-rendering: crisp-edges;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; direction: rtl; padding: 20px;
        }
        #loginScreen::before { 
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.45); z-index: -1; 
        }
        .login-box {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.2);
            padding: 30px; border-radius: 25px; width: 100%; max-width: 360px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); text-align: center; transition: all 0.3s ease;
        }
        .login-box h2 { color: #ffeb3b; margin-bottom: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); font-size: 22px; }
        .login-box input {
            width: 100%; padding: 12px 15px; margin: 8px 0; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.4);
            color: #fff; text-align: center; font-size: 14px; outline: none;
            user-select: text !important; -webkit-user-select: text !important;
        }
        .login-box input:focus { border-color: #ffeb3b; box-shadow: 0 0 10px rgba(255,235,59,0.3); }
        .login-btn {
            width: 100%; padding: 12px; border-radius: 12px;
            border: none; color: white; font-size: 16px;
            font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .login-btn:active { transform: scale(0.98); }
        /* 🖼️ تنظیم دکمه شروع در مرکز و اعمال رنگ پس‌زمینه پشتیبان شیک در صورت لود نشدن عکس */
        #setupMenu {
            position: absolute; top: 0; left: 0; 
            background: radial-gradient(circle, #25252d 0%, #111116 100%);
            background-image: url('menu_bg.jpg');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            image-rendering: crisp-edges; width: 100%; height: 100%; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 20; padding: 20px; direction: rtl;
        }
        #setupMenu::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); z-index: -1; }
        
        #gearBtn {
            position: absolute; top: 20px; left: 20px; background: rgba(255, 255, 255, 0.25); 
            border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; backdrop-filter: blur(5px);
            width: 50px; height: 50px; font-size: 22px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 25; transition: transform 0.2s;
        }
        #gearBtn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.4); }

        #startBtn { 
            position: relative; width: 140px; height: 140px; border-radius: 50%;
            background-image: url('1.png'); 
            background-size: cover; background-position: center; background-repeat: no-repeat;
            border: 4px solid #fff; color: white; font-size: 24px; font-weight: bold; cursor: pointer; z-index: 25;
            display: flex; align-items: center; justify-content: center; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6), inset 0 -8px 20px rgba(0,0,0,0.6), inset 0 8px 20px rgba(255,255,255,0.3);
            text-shadow: 0 2px 5px rgba(0,0,0,0.9); transition: transform 0.2s, box-shadow 0.2s;
        }
        #startBtn:active { transform: scale(0.95); box-shadow: 0 5px 15px rgba(0,0,0,0.4); }
        
        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 30; display: none; }
        .drawer {
            position: fixed; bottom: -100%; left: 0; width: 100%; max-height: 85vh; 
            background: #222; border-radius: 25px 25px 0 0; padding: 20px; z-index: 31; transition: bottom 0.4s cubic-bezier(0.1, 1, 0.1, 1); overflow-y: auto; direction: rtl;
            touch-action: pan-y !important; display: flex; flex-direction: column; align-items: center;
        }
        .drawer.open { bottom: 0; }
        
        .drawer-close-btn { 
            background: #2196f3; border: none; color: white; padding: 14px 28px; width: 100%; max-width: 320px;
            border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 16px; text-align: center;
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3); margin-top: 20px; margin-bottom: 10px;
        }
        .drawer-close-btn:active { background: #1976d2; }
        .menu-row { margin: 15px 0; text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center; }
        .menu-row label { display: block; font-size: 16px; margin-bottom: 10px; font-weight: bold; color: #ffeb3b; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        
        .count-column-select { display: flex; justify-content: center; gap: 8px; width: 100%; max-width: 340px; flex-wrap: wrap; }
        .count-button-item { flex: 1; min-width: 75px; padding: 10px 5px; font-size: 12px; font-weight: bold; background: rgba(37,37,37,0.85); border: 2px solid #444; border-radius: 12px; color: white; cursor: pointer; text-align: center; transition: background 0.2s, border-color 0.2s; }
        .count-button-item.active { background: #4caf50; border-color: #fff; box-shadow: 0 0 12px #4caf50; }

        .scroll-container { display: flex; justify-content: flex-start; overflow-x: auto; gap: 12px; padding: 10px 5px; width: 100%; max-width: 360px; -webkit-overflow-scrolling: touch; touch-action: pan-x !important; }
        .scroll-item { flex: 0 0 70px; border: 3px solid #555; border-radius: 12px; overflow: hidden; cursor: pointer; aspect-ratio: 1; background: rgba(0,0,0,0.4); position: relative; }
        .scroll-item canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
        .scroll-item.active { border-color: #4caf50; box-shadow: 0 0 15px #4caf50; }
        
        .custom-select { width: 100%; max-width: 260px; padding: 12px; font-size: 15px; font-weight: bold; background: rgba(37,37,37,0.9); border: 2px solid #555; border-radius: 12px; color: white; text-align: center; direction: rtl; outline: none; cursor: pointer; }
        .custom-select:focus { border-color: #4caf50; box-shadow: 0 0 10px rgba(76,175,80,0.4); }
        
        .name-input-container { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; margin-top: 5px; }
        .player-row-item { display: flex; flex-direction: column; gap: 5px; width: 100%; background: rgba(255,255,255,0.03); border: 1px solid #333; padding: 8px; border-radius: 14px; }
        .player-inputs { display: flex; gap: 6px; width: 100%; align-items: center; }
        .player-inputs input { flex: 1; padding: 10px; font-size: 13px; background: rgba(26,26,26,0.9); border: 2px solid #444; border-radius: 10px; color: white; text-align: center; direction: rtl; user-select: text !important; -webkit-user-select: text !important; }
        .player-inputs input:focus { border-color: #4caf50; outline: none; }
        .order-badge { width: 65px; padding: 10px 0; font-size: 12px; font-weight: bold; background: #333; border: 2px solid #555; border-radius: 10px; color: #aaa; text-align: center; }
        .order-badge.assigned { background: #ff9800; border-color: #fff; color: #000; box-shadow: 0 0 8px #ff9800; }

        #canvas { display: none; touch-action: none; image-rendering: crisp-edges; background-color: #222; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        #gameHeader { display: none; width: 90vw; max-width: 430px; justify-content: space-between; align-items: center; position: absolute; top: 15px; z-index: 10; direction: rtl; }
        #exitBtn { background: #e53935; color: white; border: none; border-radius: 12px; padding: 8px 18px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,0.3); }
        #turnIndicator { font-size: 16px; font-weight: bold; color: #ffeb3b; background: rgba(0,0,0,0.6); padding: 6px 14px; border-radius: 10px; }

        /* 🟢 🏁 کارت نئونی لیدربورد زنده مسابقه حین بازی */
        #inGameShopPanel {
            display: none; position: absolute; top: 75px; right: 15px; z-index: 15;
            background: rgba(20, 20, 25, 0.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15); padding: 14px; border-radius: 20px;
            direction: rtl; font-family: sans-serif; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-width: 190px; text-align: center;
        }
        #inGameShopPanel .panel-title { font-size: 13px; font-weight: bold; color: #ffeb3b; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .score-list { display: flex; flex-direction: column; gap: 8px; text-align: right; max-height: 180px; overflow-y: auto; }
        
        .score-item-row { 
            display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; 
            transition: all 0.3s ease;
        }
        .score-item-main { display: flex; justify-content: space-between; font-size: 12px; color: #eee; align-items: center; }
        .score-item-name { font-weight: 500; }
        .score-item-values { font-size: 11px; color: #aaa; }
        
        .score-item-row.active-turn { 
            background: rgba(76, 175, 80, 0.15); border: 1px solid rgba(76, 175, 80, 0.5); 
            box-shadow: 0 0 12px rgba(76,175,80,0.2); animation: activePulse 2s infinite ease-in-out;
        }
        @keyframes activePulse { 0% { border-color: rgba(76, 175, 80, 0.4); } 50% { border-color: rgba(76, 175, 80, 0.9); } 100% { border-color: rgba(76, 175, 80, 0.4); } }
        
        .score-progress-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; margin-top: 3px; }
        .score-progress-fill { height: 100%; background: #ff9800; border-radius: 2px; width: 0%; transition: width 0.4s ease; }
        .score-item-row.active-turn .score-progress-fill { background: #4caf50; }

        .lucky-wheel-btn { background: #ff9800; color: black; border: none; border-radius: 12px; padding: 10px 20px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 10px rgba(255,152,0,0.3); transition: transform 0.2s; }
        .lucky-wheel-btn:active { transform: scale(0.95); }
        .wheel-container { display: none; flex-direction: column; align-items: center; margin: 15px 0; position: relative; }
        .wheel-pointer { width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 20px solid #e53935; position: absolute; top: -5px; z-index: 5; }
        #wheelCanvas { border: 4px solid #fff; border-radius: 50%; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }

        .custom-popup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 150; padding: 20px;
        }
        .custom-popup-box {
            background: rgba(25, 30, 35, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 235, 59, 0.5); border-radius: 25px; padding: 25px;
            width: 100%; max-width: 360px; text-align: center; direction: rtl;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7); animation: popupShow 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popupShow { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .popup-icon { font-size: 45px; margin-bottom: 12px; display: inline-block; animation: pulseIcon 1.5s infinite; }
        @keyframes pulseIcon { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
        .popup-text { font-size: 14px; line-height: 1.6; color: #fff; margin-bottom: 15px; }
        
        .final-table { width: 100%; margin: 15px 0; border-collapse: collapse; font-size: 13px; color: #fff; }
        .final-table th, .final-table td { padding: 8px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .final-table th { background: rgba(255,235,59,0.15); color: #ffeb3b; }
        .final-table tr:nth-child(even) { background: rgba(255,255,255,0.03); }
        .final-actions { display: flex; gap: 10px; margin-top: 15px; width: 100%; }
        
        .popup-btn {
            flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 14px;
            font-weight: bold; cursor: pointer; color: white; text-align: center;
        }
        .popup-btn.success { background: linear-gradient(90deg, #4caf50, #81c784); box-shadow: 0 4px 12px rgba(76,175,80,0.3); }
        .popup-btn.danger { background: linear-gradient(90deg, #ff5722, #ff8a65); box-shadow: 0 4px 12px rgba(255,87,34,0.3); }
    </style>
</head>
<body>

    <!-- 🟢 فرم شیشه‌ای هوشمند: ابتدا فقط کد ملی را می‌گیرد و سپس بر اساس سابقه کاربر فیلدها را باز می‌کند -->
    <div id="loginScreen">
        <div class="login-box">
            <h2 id="authFormTitle">📝 ورود یا عضویت بازیکنان</h2>
            
            <!-- فیلد اول کد ملی که همیشه باز است و طول ورودی آن پایش می‌شود -->
            <input type="number" id="identifierInput" placeholder="کد ملی (۱۰ رقمی)" oninput="checkNationalIdStatus()">
            
            <!-- فیلدهای پویا که بر اساس ثبت‌نام قبلی پله‌پله باز یا بسته می‌شوند -->
            <input type="text" id="usernameInput" placeholder="نام و نام خانوادگی (فارسی)" style="display: none;">
            <input type="password" id="passwordInput" placeholder="رمز عبور" style="display: none;">
            
            <!-- دکمه تایید نهایی یکپارچه برای پیشبرد مراحل لاگین هوشمند -->
            <div style="display: flex; gap: 10px; margin-top: 15px; width: 100%;">
                <button class="login-btn" id="authSubmitBtn" style="margin-top:0; background: #2196f3; width: 100%;" onclick="processSmartAuth()">تایید و ادامه</button>
            </div>
        </div>
    </div>

    <!-- 🟢 منوی اصلی بازی با دکمه‌های کنترلی و دکمه شروع مرکزی -->
    <div id="setupMenu" style="display: none;">
        <button id="gearBtn">⚙️</button>
        <button id="startBtn">شروع</button>
    </div>

    <!-- 🟢 کارت لیدربورد نئونی زنده مسابقه با پالس نوری و نوار وضعیت متحرک حین مسابقه -->
    <div id="inGameShopPanel">
        <div class="panel-title">🏆 جدول زنده مسابقه</div>
        <div class="score-list" id="realtimeLeaderboard">
            <!-- ردیف‌های امتیازات بازیکنان به صورت پویا پر می‌شود -->
        </div>
    </div>

    <!-- 🟢 پاپ‌آ‌پ انیمیشنی استادیومی مخصوص نمایش جدول نهایی نمرات با دو دکمه مسابقه جدید و خروج -->
    <div class="custom-popup-overlay" id="gamePopup">
        <div class="custom-popup-box">
            <span class="popup-icon" id="popupIcon">🎉</span>
            <div class="popup-text" id="popupText">متن پیام در اینجا قرار می‌گیرد.</div>
            
            <table class="final-table" id="finalScoreTable" style="display: none;">
                <thead>
                    <tr>
                        <th>بازیکن</th>
                        <th>تیله‌های خارج شده</th>
                        <th>بانک کل (تیله)</th>
                    </tr>
                </thead>
                <tbody id="finalTableBody">
                    <!-- دیتا به صورت داینامیک پر می‌شود -->
                </tbody>
            </table>

            <div class="final-actions" id="popupActionButtons">
                <button class="popup-btn success" id="popupBtn" onclick="closeCustomPopup()">تایید و ادامه</button>
            </div>
        </div>
    </div>
    <div class="drawer-overlay" id="overlay"></div>
    <div class="drawer" id="settingsDrawer">
        <h3 style="margin-top: 50px; margin-bottom: 10px; color: #ffeb3b; text-align: center;">حالا وقتشه بازی رو جذاب کنیم!</h3><br><br><br><br>
        
        <div class="menu-row">
            <label>کجا میخوای بازی کنیم؟</label>
            <!-- کانتینر اسکرول افقی زمین‌های مسابقه شخصی شما -->
            <div class="scroll-container" id="groundGrid">
                <div class="scroll-item active" data-val="grass"><canvas id="pre_grass"></canvas></div>
                <div class="scroll-item" data-val="carpet"><canvas id="pre_carpet"></canvas></div>
                <div class="scroll-item" data-val="asphalt"><canvas id="pre_asphalt"></canvas></div>
                <div class="scroll-item" data-val="cement"><canvas id="pre_cement"></canvas></div>
                <div class="scroll-item" data-val="dirt"><canvas id="pre_dirt"></canvas></div>
            </div>
        </div>

        <div class="menu-row">
            <label>در چه هوایی بازی می چسبه؟</label>
            <div class="count-column-select" id="weatherGrid">
                <div class="count-button-item active" data-val="sunny">☀️ آفتابی</div>
                <div class="count-button-item" data-val="windy">💨 باد شدید</div>
                <div class="count-button-item" data-val="rainy">🌧️ بارانی</div>
                <div class="count-button-item" data-val="snowy">❄️ برفی</div>
            </div>
        </div>

        <div class="menu-row">
            <label>دوست داری چند نفره باشیم؟</label>
            <select class="custom-select" id="playerCountSelect">
                <option value="1" selected>۱ نفره (انفرادی)</option>
                <option value="2">۲ نفره</option>
                <option value="3">۳ نفره</option>
                <option value="4">۴ نفره</option>
                <option value="5">۵ نفره</option>
                <option value="6">۶ نفره</option>
            </select>
            
            <div class="name-input-container" id="namesContainer" style="margin-top: 15px; margin-bottom: 5px;">
                <div class="player-row-item">
                    <div class="player-inputs">
                        <input type="text" id="pInput0" value="بازیکن ۱" placeholder="نام فارسی بازیکن ۱" disabled>
                    </div>
                </div>
            </div>

            <button class="lucky-wheel-btn" id="drawOrderBtn" style="display: none;">🎰 ببینیم نوبت اول کیه ؟</button>
            <div class="wheel-container" id="wheelSection">
                <div class="wheel-pointer"></div>
                <canvas id="wheelCanvas" width="240" height="240"></canvas>
            </div>
        </div>

        <div class="menu-row">
            <label>با چند تا تیله بریم بازی؟</label>
            <select class="custom-select" id="marbleCountSelect">
                <option value="2">۲ تیله</option>
                <option value="3">۳ تیله</option>
                <option value="4">۴ تیله</option>
                <option value="5" selected>۵ تیله</option>
                <option value="6">۶ تیله</option>
                <option value="7">۷ تیله</option>
                <option value="8">۸ تیله</option>
                <option value="9">۹ تیله</option>
                <option value="10">۱۰ تیله</option>
            </select>
        </div>

        <div class="menu-row" style="display:none;" id="targetGridContainer">
            <div id="targetGrid"><div data-val="1.png"></div></div>
        </div>

        <button class="drawer-close-btn" id="closeDrawer">همه چی عالی شد!     بریم؟</button>
    </div>

    <div id="gameHeader">
        <button id="exitBtn">خروج</button>
        <div id="turnIndicator">نوبت: بازیکن ۱</div>
    </div>

    <!-- بوم اصلی نقاشی بازی هوشمند مجهز به موتور لمسی ضد لرزش موبایل -->
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const setupMenu = document.getElementById("setupMenu");
        const startBtn = document.getElementById("startBtn");
        const gearBtn = document.getElementById("gearBtn");
        const settingsDrawer = document.getElementById("settingsDrawer");
        const overlay = document.getElementById("overlay");
        const closeDrawer = document.getElementById("closeDrawer");
        const gameHeader = document.getElementById("gameHeader");
        const exitBtn = document.getElementById("exitBtn"); 
        const namesContainer = document.getElementById("namesContainer");
        const turnIndicator = document.getElementById("turnIndicator");
        const inGameShopPanel = document.getElementById("inGameShopPanel");

        // 🟢 متغیرهای پایه مدیریت حساب، اقتصاد درون بازی و آرایه‌های بازیکنان که به ابتدای کد منتقل شدند تا ارور ندهند
        let totalMarblesOwned = parseInt(localStorage.getItem("totalMarblesOwned")) || 0;
        let freeShopClaims = parseInt(localStorage.getItem("freeShopClaims")) || 0;

        function loadLevel(lvl) {
            targets = [];

            let targetRadius = 16; 
            let targetDiameter = targetRadius * 2;
            let totalWidth = count * targetDiameter; 
            let startX = (box.x + box.w / 2) - (totalWidth / 2) + targetRadius;
            for (let i = 0; i < count; i++) {

        function resizeCanvas() {

        function getEventPos(e) {
            let r = canvas.getBoundingClientRect(); 
            let clientX = e.clientX; 
            let clientY = e.clientY;
            if (e.touches && e.touches.length > 0) { 
                clientX = e.touches.clientX; 
                clientY = e.touches.clientY; 
            } else if (e.changedTouches && e.changedTouches.length > 0) { 
                clientX = e.changedTouches.clientX; 
                clientY = e.changedTouches.clientY; 
            }
            return { x: (clientX - r.left) * (canvas.width / r.width), y: (clientY - r.top) * (canvas.height / r.height) };
        }

        function handleStart(e) { 
            if (e.cancelable) e.preventDefault(); 
            if (isMoving || player.inAir) return; 
            let pos = getEventPos(e); 
            isAiming = true; 
            dragStart.x = pos.x; 
            dragStart.y = pos.y; 
            dragEnd.x = pos.x; 
            dragEnd.y = pos.y; 
        }

        // 🟢 مانیتور حرکت زنده تاچ ضد لرزش موبایل و خط‌کشی زاویه پرتاب
        function handleMove(e) { 
            if (e.cancelable) e.preventDefault(); 
            if (!isAiming) return; 
            let pos = getEventPos(e); 
            dragEnd.x = pos.x; 
            dragEnd.y = pos.y; 
        }

        function handleEnd() {
            if (!isAiming) return; 
            isAiming = false;
            let dx = dragStart.x - dragEnd.x; 
            let dy = dragStart.y - dragEnd.y; 
            let dragDist = Math.sqrt(dx * dx + dy * dy);
            
            if (dragDist > 5) {
                player.startX = player.x; 
                player.startY = player.y; 
                let targetHit = null; 
                let closestDist = Infinity;
                targetOutInTurn = false; 
                
                targets.forEach(t => {
                    if (t.isOut) return;
                    let A = dy; 
                    let B = -dx; 
                    let C = dx * player.y - dy * player.x;
                    let lineDist = Math.abs(A * t.x + B * t.y + C) / Math.sqrt(A * A + B * B);
                    if (lineDist < (16 + t.r)) {
                        let dToTarget = Math.sqrt((t.x - player.x) ** 2 + (t.y - player.y) ** 2);
                        if (dToTarget < closestDist) { 
                            closestDist = dToTarget; 
                            targetHit = t; 
                        }
                    }
                });

                if (targetHit && closestDist < 120) {
                    player.arcHeight = 0; 
                    player.targetX = targetHit.x; 
                    player.targetY = targetHit.y;
                    let hitDelay = (closestDist / 5.5) * 15;
                    
                    setTimeout(() => {
                        let hitSpeed = 14 + (dragDist * 0.25);
                        playClickSound(hitSpeed / 14); 
                        let angle = Math.atan2(targetHit.y - player.startY, targetHit.x - player.startX);
                        let steps = 0;
                        
                        let slideInterval = setInterval(() => {
                            targetHit.x += Math.cos(angle) * hitSpeed; 
                            targetHit.y += Math.sin(angle) * hitSpeed;
                            targetHit.angle += hitSpeed / targetHit.r; 
                            hitSpeed *= 0.94; 
                            steps++;
                            
                            if (targetHit.x < box.x || targetHit.x > box.x + box.w || targetHit.y < box.y || targetHit.y > box.y + box.h) {
                                targetHit.isOut = true; 
                                targetOutInTurn = true; 
                                let id = playerNationalIds[currentPlayerIndex] || "";
                                if (id === currentNationalId) { 
                                    totalMarblesOwned++; 
                                } else { 
                                    let cur = parseInt(localStorage.getItem(`marbles_${id}`)) || 0; 
                                    localStorage.setItem(`marbles_${id}`, cur + 1); 
                                }
                                if(playerScores[currentPlayerIndex] !== undefined) playerScores[currentPlayerIndex]++;
                                updateWalletUI();
                            }
                            if (steps > 60 || hitSpeed < 0.5 || targetHit.isOut) { 
                                clearInterval(slideInterval); 
                                setTimeout(resetRound, 100); 
                            }
                        }, 16);
                    }, hitDelay);
                } else {
                    let cX = player.x + dx * 5.5; 
                    let cY = player.y + dy * 5.5; 
                    let padding = player.baseR + 4;
                    if (cX < box.x + padding) cX = box.x + padding; 
                    if (cX > box.x + box.w - padding) cX = box.x + box.w - padding;
                    if (cY < box.y + padding) cY = box.y + padding; 
                    if (cY > box.y + box.h - padding) cY = box.y + box.h - padding;
                    player.targetX = cX; 
                    player.targetY = cY; 
                    player.arcHeight = Math.min(dragDist * 0.45, 140);
                }
                
                // 🟢 اعمال علامت مساوی کاملاً تمیز بدون خطای ویرگول یا دو نقطه
                player.progress = 0; 
                player.inAir = true; 
                isFirstShotOfTurn = false;
            }
        }
        function gameLoop() {
            if (canvas.style.display === "none") { gameLoopRunning = false; return; }
            let weatherFrictionModifier = selectedWeather === "rainy" ? 0.995 : (selectedWeather === "snowy" ? 0.997 : 1);
            if (player.inAir) {
                player.progress += 0.03;
                player.x = player.startX + (player.targetX - player.startX) * player.progress;
                player.y = player.startY + (player.targetY - player.startY) * player.progress;
                player.x += windX * player.progress * 15; player.y += windY * player.progress * 15;
                player.z = Math.sin(player.progress * Math.PI) * player.arcHeight; player.r = player.baseR + player.z * 0.35;
                let tSpeed = Math.sqrt(Math.pow(player.targetX - player.startX, 2) + Math.pow(player.targetY - player.startY, 2)) * 0.02;
                player.angle += tSpeed / player.baseR;
                if (player.progress >= 1) {
                    player.x = player.targetX; player.y = player.targetY; player.z = 0; player.progress = 0; player.inAir = false; player.r = player.baseR;
                    playClickSound(0.5); let hitAny = false;
                    targets.forEach(t => {
                        if (!t.isOut) {
                            let dx = t.x - player.x; let dy = t.y - player.y; let dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist < (player.r + t.r)) { hitAny = true; playClickSound(0.9); let angle = Math.atan2(dy, dx); t.vx = Math.cos(angle) * 8; t.vy = Math.sin(angle) * 8; }
                        }
                    });
                    if (!hitAny) { setTimeout(resetRound, 100); }
                }
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (imgBg.complete && imgBg.naturalWidth !== 0) ctx.drawImage(imgBg, 0, 0, canvas.width, canvas.height);
            else { ctx.fillStyle = currentGround.fallbackColor; ctx.fillRect(0, 0, canvas.width, canvas.height); }
            drawDynamicBorder();
            targets.forEach(t => {
                if (!t.isOut) {
                    t.x += t.vx; t.y += t.vy; t.vx *= (currentGround.friction * weatherFrictionModifier); t.vy *= (currentGround.friction * weatherFrictionModifier);
                    let speed = Math.sqrt(t.vx*t.vx + t.vy*t.vy); t.angle += speed / t.r;
                    if (t.x < box.x || t.x > box.x + box.w || t.y < box.y || t.y > box.y + box.h) { 
                        t.isOut = true; targetOutInTurn = true; 
                        let id = playerNationalIds[currentPlayerIndex] || "";
                        if (id === currentNationalId) { totalMarblesOwned++; } 
                        else { let cur = parseInt(localStorage.getItem(`marbles_${id}`)) || 0; localStorage.setItem(`marbles_${id}`, cur + 1); }
                        if(playerScores[currentPlayerIndex] !== undefined) playerScores[currentPlayerIndex]++;
                        updateWalletUI();
                    }
                    ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(t.angle); ctx.beginPath(); ctx.arc(0, 0, t.r, 0, Math.PI * 2); ctx.clip();
                    if (imgTarget.complete && imgTarget.naturalWidth !== 0) ctx.drawImage(imgTarget, -t.r, -t.r, t.r * 2, t.r * 2);
                    else { ctx.fillStyle = "#ff5722"; ctx.fill(); }
                    ctx.restore();
                }
            });
            ctx.save(); ctx.translate(player.x, player.y - player.z); ctx.rotate(player.angle); ctx.beginPath(); ctx.arc(0, 0, player.r, 0, Math.PI * 2); ctx.clip();
            if (imgPlayer.complete && imgPlayer.naturalWidth !== 0) ctx.drawImage(imgPlayer, -player.r, -player.r, player.r * 2, player.r * 2);
            else { ctx.fillStyle = "#2196f3"; ctx.fill(); }
            ctx.restore();
            if (isAiming) { ctx.beginPath(); ctx.strokeStyle = "rgba(255, 255, 255, 0.5)"; ctx.lineWidth = 3; ctx.moveTo(player.x, player.y); ctx.lineTo(player.x + (dragStart.x - dragEnd.x), player.y + (dragStart.y - dragEnd.y)); ctx.stroke(); }
            updateWeatherParticles(); drawWeather(); requestAnimationFrame(gameLoop);
        }
        function preloadAssetsAndLaunch() {
            showGameToast("⏳ در حال تدارک اتمسفر استادیوم...");
            imgBg.src = currentGround.src; imgPlayer.src = '6.png'; imgTarget.src = '1.png';
            
            let isLaunched = false;
            const forceLaunchTimeout = setTimeout(() => {
                if (!isLaunched) {
                    isLaunched = true;
                    runGameInitialization();
                }
            }, 2000);

            const loadPromises = [
                new Promise(resolve => { if (imgBg.complete) resolve(); else imgBg.onload = resolve; imgBg.onerror = resolve; }),
                new Promise(resolve => { if (imgPlayer.complete) resolve(); else imgPlayer.onload = resolve; imgPlayer.onerror = resolve; }),
                new Promise(resolve => { if (imgTarget.complete) resolve(); else imgTarget.onload = resolve; imgTarget.onerror = resolve; })
            ];

            Promise.all(loadPromises).then(() => {
                if (!isLaunched) {
                    clearTimeout(forceLaunchTimeout);
                    isLaunched = true;
                    runGameInitialization();
                }
            });
        }

        function runGameInitialization() {
            setupMenu.style.display = "none"; canvas.style.display = "block"; gameHeader.style.display = "flex";
            if(inGameShopPanel) inGameShopPanel.style.display = "block"; 
            
            currentPlayerIndex = 0; playerScores = Array(selectedPlayerCount).fill(0); resizeCanvas();
            isFirstShotOfTurn = true; hitSuccessInTurn = false; targetOutInTurn = false; hasBonusShot = false; isChainMode = false;
            
            let initX = canvas.width / 2; let initY = canvas.height - 120;
            player.x = initX; player.y = initY; player.startX = initX; player.startY = initY; player.targetX = initX; player.targetY = initY; player.angle = 0;
            player.vx = 0; player.vy = 0; player.z = 0; player.progress = 0; player.inAir = false; player.r = player.baseR;
            
            loadLevel(1); initWeatherParticles(); initWindLines(); updateWalletUI();
            
            if (turnIndicator) {
                let id = playerNationalIds[currentPlayerIndex] || "";
                let pMarbles = id === currentNationalId ? totalMarblesOwned : (parseInt(localStorage.getItem(`marbles_${id}`)) || 0);
                turnIndicator.innerText = `نوبت: ${playerNames[currentPlayerIndex]} (بانک: ${pMarbles})`;
            }
            
            if (!gameLoopRunning) { 
                gameLoopRunning = true; 
                setTimeout(() => { requestAnimationFrame(gameLoop); }, 50); 
            }
        }

        function launchGameDirectly() {
            if (totalMarblesOwned < selectedCountVal) {
                showCustomPopup(`اوپس! موجودی شما کافی نیست. هزینه ورودی مسابقه ${selectedCountVal} تیله است اما دارایی شما ${totalMarblesOwned} عدد می‌باشد!`, "💎", "💸 شارژ فوری و دریافت تیله هدیه", true, function() { totalMarblesOwned += 10; updateWalletUI(); showCustomPopup("بانک شما با موفقیت به مقدار ۱۰ تیله شارژ شد! میدان مسابقه قفل‌گشایی گردید.", "⚡", "شروع پرقدرت بازی"); });
                return;
            }
            totalMarblesOwned -= selectedCountVal; preloadAssetsAndLaunch();
        }

        closeDrawer.onclick = () => { initAudio(); if(!saveSubPlayersData()) return; settingsDrawer.classList.remove("open"); overlay.style.display = "none"; startAmbientSound(selectedWeather); launchGameDirectly(); };
        startBtn.onclick = () => { initAudio(); if(playerNationalIds.length === 0){ playerNationalIds = [currentNationalId || localStorage.getItem("currentNationalId") || ""]; } updateNameInputs(1); playerNames = [currentUsername || localStorage.getItem("currentUsername") || "بازیکن ۱"]; playerOrders = []; startAmbientSound(selectedWeather); launchGameDirectly(); };
        gearBtn.onclick = () => { initAudio(); settingsDrawer.classList.add("open"); overlay.style.display = "block"; };
        overlay.onclick = () => { settingsDrawer.classList.remove("open"); overlay.style.display = "none"; };
        exitBtn.onclick = () => { stopAmbientSound(); canvas.style.display = "none"; gameHeader.style.display = "none"; if(inGameShopPanel) inGameShopPanel.style.display = "none"; setupMenu.style.display = "flex"; playerNames = []; playerOrders = []; playerNationalIds = []; gameLoopRunning = false; updateWalletUI(); };

        function setupGridSelector(containerId, activeClass, callback) {
            const container = document.getElementById(containerId); if(!container) return;
            container.addEventListener('click', (e) => {
                const item = e.target.closest('[data-val]'); if (!item) return;
                container.querySelectorAll('[data-val]').forEach(i => i.classList.remove(activeClass));
                item.classList.add(activeClass); callback(item.getAttribute('data-val'));
            });
        }

        canvas.addEventListener("mousedown", handleStart); canvas.addEventListener("mousemove", handleMove); canvas.addEventListener("mouseup", handleEnd);
        canvas.addEventListener("touchstart", handleStart, { passive: false }); canvas.addEventListener("touchmove", handleMove, { passive: false }); canvas.addEventListener("touchend", handleEnd, { passive: false });
        setupGridSelector('groundGrid', 'active', (val) => { selectedGroundVal = val; currentGround = grounds[val]; playGroundPreviewSound(val); });
        setupGridSelector('weatherGrid', 'active', (val) => { selectedWeather = val; if(val === 'sunny') { windX = 0; windY = 0; } else if(val === 'windy') { windX = 0.08; windY = 0.02; } else if(val === 'rainy') { windX = 0.03; windY = 0.05; } else { windX = 0.01; windY = 0.02; } playWeatherPreviewSound(val); });
        document.getElementById("playerCountSelect").onchange = (e) => { selectedPlayerCount = parseInt(e.target.value); updateNameInputs(selectedPlayerCount); };
        document.getElementById("marbleCountSelect").onchange = (e) => { selectedCountVal = parseInt(e.target.value); };
        
        // 🟢 مانیتور لیدربورد نئونی زنده در صفحه مسابقه
        function updateLiveLeaderboardUI() {
            const list = document.getElementById("realtimeLeaderboard"); if (!list) return;
            list.innerHTML = "";
            let maxScore = Math.max(...playerScores, 1);
            playerNames.forEach((name, idx) => {
                let id = playerNationalIds[idx] || "";
                let pMarbles = id === currentNationalId ? totalMarblesOwned : (parseInt(localStorage.getItem(`marbles_${id}`)) || 0);
                let score = playerScores[idx] || 0;
                let pct = Math.min((score / maxScore) * 100, 100);
                let isCurrent = (idx === currentPlayerIndex && canvas.style.display === "block");
                
                let row = document.createElement("div");
                row.className = isCurrent ? "score-item-row active-turn" : "score-item-row";
                row.innerHTML = `<div class="score-item-main">` +
                                    `<span class="score-item-name">${isCurrent ? "🎯 " : ""}${name}</span>` +
                                    `<span class="score-item-values"><b>${score}</b> شوت | 💰 ${pMarbles}</span>` +
                                `</div>` +
                                `<div class="score-progress-bar"><div class="score-progress-fill" style="width: ${pct}%"></div></div>`;
                list.appendChild(row);
            });
        }

        window.addEventListener("DOMContentLoaded", () => { generateMenuPreviews(); if(currentNationalId){ playerNationalIds = [currentNationalId]; playerNames = [currentUsername || "بازیکن ۱"]; } updateNameInputs(selectedPlayerCount); resizeCanvas(); updateWalletUI(); });
        window.addEventListener("resize", resizeCanvas);
    </script>
</body>
</html>
