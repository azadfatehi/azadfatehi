    </style>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Error:', err));
            });
        }
		        function showRadarJoinInput() {
            let form = document.getElementById("p2pJoinForm");
            if(form) form.style.display = "block";
            let statusText = document.getElementById("p2pStatusText");
            if(statusText) statusText.innerText = "📡 وضعیت رادار: آماده برای وارد کردن کد...";
        }
        function generateRadarCode() {
            let chars = "0123456789"; let code = "";
            for(let i=0; i<6; i++) { code += chars[Math.floor(Math.random() * chars.length)]; }
            return code;
        }
        function initiateRadarHost() {
            let statusText = document.getElementById("p2pStatusText");
            let randomCode = generateRadarCode();
            if(statusText) statusText.innerHTML = `📡 کاتالیزور فعال شد!<br>کد اتصال شما: <span style="color:#ffeb3b; font-size:16px; font-weight:900;">${randomCode}</span><br><span style="font-size:11px; color:#aaa;">(این کد را در گوشی دوم وارد کنید)</span>`;
            
            isMyTurnOnline = true;
            playerNames = [currentUsername || "میزبان", "بازیکن دوم"];
            showGameToast("⏳ رادار روشن شد. منتظر ورود حریف...");
            // در بخش‌های بعدی تابع گوش دادن به اتصال حریف را کامل می‌کنیم
        }
        function connectToRadarHost() {
            let codeInput = document.getElementById("radarConnectCodeInput");
            let statusText = document.getElementById("p2pStatusText");
            let code = codeInput ? codeInput.value.trim() : "";
            if (code.length !== 6) { showCustomPopup("کد اتصال رادار باید دقیقاً ۶ رقم باشد.", "⚠️", "اصلاح کد", true); return; }
            if (statusText) statusText.innerText = "📡 در حال جستجوی رادار میزبان...";
            
            isMyTurnOnline = false;
            playerNames = ["میزبان", currentUsername || "مهمان"];
            // شبیه‌سازی و جفت‌سازی مستقیم بدون اینترنت بر روی لوکال پی‌سی/هات‌اسپات
            setTimeout(() => {
                if (statusText) statusText.style.color = "#4caf50";
                if (statusText) statusText.innerText = "✅ متصل شد! بازی سینک شد.";
                showGameToast("🎮 اتصال با موفقیت برقرار شد!");
                handleDrawerExit();
                gearBtn.style.display = "none";
                preloadAssetsAndLaunch();
            }, 1200);
        }
        function sendRadarMoveData(dx, dy, dragDist) {
            let movePacket = {
                type: "shoot",
                dx: dx,
                dy: dy,
                dist: dragDist,
                playerIndex: currentPlayerIndex
            };
            // داده‌ها آماده فرستادن روی رادار شبکه محلی
            console.log("ارسال داده‌های شلیک رادار:", movePacket);
        }
        function receiveRadarMoveData(packet) {
            if (!packet || packet.type !== "shoot") return;
            player.startX = player.x; player.startY = player.y;
            player.vx = packet.dx * 0.15; player.vy = packet.dy * 0.15;
            player.arcHeight = Math.min(packet.dist * 0.5, 140);
            player.progress = 0; player.inAir = true; isFirstShotOfTurn = false;
        }

    </script>

        function initWeatherParticles() { weatherParticles = []; let count = selectedWeather === "sunny" ? 0 : (selectedWeather === "rainy" ? 120 : 80); let wW = window.innerWidth || canvas.width || 400; let wH = window.innerHeight || canvas.height || 600; for(let i=0; i<count; i++) { weatherParticles.push({ x: Math.random() * wW, y: Math.random() * wH, v: selectedWeather === "rainy" ? (Math.random() * 5 + 6) : (Math.random() * 1.5 + 1), r: selectedWeather === "rainy" ? (Math.random() * 1 + 1.5) : (Math.random() * 2 + 2), opacity: Math.random() * 0.5 + 0.3 }); } }
        function initWindLines() { windLines = []; if (selectedWeather === "sunny") return; let count = selectedWeather === "windy" ? 25 : 10; let wW = canvas.width || window.innerWidth || 400; let wH = canvas.height || window.innerHeight || 600; for (let i = 0; i < count; i++) { windLines.push({ x: Math.random() * wW, y: Math.random() * wH, w: Math.random() * 80 + 40, h: Math.random() * 1.5 + 0.5, v: Math.random() * 4 + 3, opacity: Math.random() * 0.2 + 0.05 }); } }

        function showGameToast(message) { let toast = document.getElementById("gameToast"); if (!toast) { toast = document.createElement("div"); toast.id = "gameToast"; toast.className = "game-toast"; document.body.appendChild(toast); } toast.innerText = message; toast.classList.add("show"); setTimeout(() => { toast.classList.remove("show"); }, 1500); }
		        function resetRound() {
            // 🔓 شکستن فوری قفل حرکت برای باز شدن مسیر لود جدول امتیازات
            isMoving = false;

            let activeTargets = targets.filter(t => !t.isOut).length;

            } else {
                try { playDisappointmentSound(); } catch(e){}
                showGameToast("😔 اوووف! نزدیک بود...");
                
                if (selectedPlayerCount === 1 || isQuickRandomMode || (typeof localSocket !== 'undefined' && localSocket)) { 
                    hasBonusShot = false; isChainMode = false; 
                } else {
                    if (isChainMode || !targetOutInTurn) { 
                        isChainMode = false; 
                        currentPlayerIndex = (currentPlayerIndex + 1) % selectedPlayerCount; 
                    }
                    hasBonusShot = false;
                }
            }
            isFirstShotOfTurn = true; hitSuccessInTurn = false; targetOutInTurn = false; 
            if (!isQuickRandomMode && !(typeof localSocket !== 'undefined' && localSocket)) updateWalletUI();
        }

            isFirstShotOfTurn = true; hitSuccessInTurn = false; targetOutInTurn = false;

        function drawDynamicBorder() { ctx.save(); ctx.lineWidth = 4; ctx.strokeStyle = "rgba(255, 255, 255, 0.55)"; ctx.strokeRect(box.x, box.y, box.w, box.h); ctx.fillStyle = "rgba(0, 0, 0, 0.12)"; ctx.fillRect(box.x, box.y, box.w, box.h); ctx.restore(); }
        function loadLevel(lvl) { targets = []; let totalMarblesToPlace = selectedCountVal * selectedPlayerCount; let centerY = box.y + box.h / 2; let targetRadius = 14; let targetDiameter = targetRadius * 2; let totalWidth = totalMarblesToPlace * targetDiameter; let startX = (box.x + box.w / 2) - (totalWidth / 2) + targetRadius; for (let i = 0; i < totalMarblesToPlace; i++) { targets.push({ x: startX + (i * targetDiameter), y: centerY + (Math.sin(i) * 5), r: targetRadius, vx: 0, vy: 0, angle: 0, angleX: 0, angleY: 0, isOut: false }); } }
        function drawWheel(currentAngle = 0) { const wCanvas = document.getElementById("wheelCanvas"); if (!wCanvas) return; const wCtx = wCanvas.getContext("2d"); const count = selectedPlayerCount; const radius = wCanvas.width / 2; wCtx.clearRect(0, 0, wCanvas.width, wCanvas.height); const colors = ["#e53935", "#1e88e5", "#43a047", "#fdd835", "#9c27b0", "#ff5722"]; const sliceAngle = (Math.PI * 2) / count; for(let i = 0; i < count; i++) { let startA = currentAngle + (i * sliceAngle) - (Math.PI * 1.5); let endA = startA + sliceAngle; wCtx.fillStyle = colors[i % colors.length]; wCtx.beginPath(); wCtx.moveTo(radius, radius); wCtx.arc(radius, radius, radius - 6, startA, endA); wCtx.fill(); wCtx.strokeStyle = "#fff"; wCtx.lineWidth = 2; wCtx.stroke(); let textAngle = startA + sliceAngle / 2; let normAngle = textAngle % (Math.PI * 2); if (normAngle < 0) normAngle += Math.PI * 2; wCtx.save(); wCtx.translate(radius, radius); wCtx.rotate(textAngle); if (normAngle > Math.PI / 2 && normAngle < (3 * Math.PI) / 2) { wCtx.translate(radius - 65, 0); wCtx.rotate(Math.PI); } else { wCtx.translate(radius - 65, 0); } wCtx.fillStyle = (i % colors.length === 3) ? "#000" : "#fff"; wCtx.font = "bold 13px sans-serif"; wCtx.textAlign = "center"; wCtx.textBaseline = "middle"; wCtx.fillText((playerNames[i] || `بازیکن ${i + 1}`).substring(0, 12), 0, 0); wCtx.restore(); } wCtx.beginPath(); wCtx.fillStyle = "#fff"; wCtx.arc(radius, radius, 14, 0, Math.PI * 2); wCtx.fill(); wCtx.stroke(); }
        function updateNameInputs(count) { 
            namesContainer.innerHTML = ""; 
            playerOrders = []; 
            const drawOrderBtn = document.getElementById("drawOrderBtn"); 
            const wheelSection = document.getElementById("wheelSection"); 
            let currentValidName = currentUsername || localStorage.getItem("currentUsername") || "بازیکن ۱"; 
            let mainRow = document.createElement("div"); 
            mainRow.className = "player-row-item"; 
            mainRow.innerHTML = `<div class="player-inputs"><input type="text" value="${currentValidName}" disabled><div class="order-badge assigned" id="mainPlayerBadge">نوبت ۱</div></div>`; 
            namesContainer.appendChild(mainRow); 
            playerOrders.push(1); 
            
            for(let i = 1; i < count; i++) { 
                playerOrders.push(i + 1); 
                let row = document.createElement("div"); 
                row.className = "player-row-item"; 
                row.innerHTML = `<div class="player-inputs"><input type="number" id="subId_${i}" placeholder="کد ملی بازیکن ${i + 1}" oninput="checkSubPlayerIdAuto(${i})" style="width:40%;"><input type="text" id="subName_${i}" placeholder="نام بازیکن ${i + 1}" style="width:40%;"><div class="order-badge" id="pBadge_${i}" style="width:20%; font-size:11px;">نامشخص</div></div>`; 
                namesContainer.appendChild(row); 
                
                document.getElementById(`subName_${i}`).oninput = () => { 
                    let temp = [currentValidName]; 
                    for(let j=1; j<count; j++){ 
                        let val = document.getElementById(`subName_${j}`)?.value.trim(); 
                        temp.push(val !== "" && val ? val : `بازیکن ${j+1}`); 
                    } 
                    playerNames = temp; 
                    drawWheel(0); 
                }; 
            } 
            
            let tempInit = [currentValidName]; 
            for(let j=1; j<count; j++){ 
                tempInit.push(`بازیکن ${j+1}`); 
            } 
            playerNames = tempInit; 
            
            // 🎰 اصلاح نمایش فیزیکی بخش گردونه و دکمه قرعه‌کشی
            if (count > 1) { 
                drawOrderBtn.style.setProperty("display", "block", "important"); 
                wheelSection.style.setProperty("display", "flex", "important"); 
                setTimeout(() => { drawWheel(0); }, 50); 
            } else { 
                drawOrderBtn.style.display = "none"; 
                wheelSection.style.display = "none"; 
            } 
        }
        function getEventPos(e) { let r = canvas.getBoundingClientRect(); let cX = e.clientX, cY = e.clientY; if (e.touches && e.touches.length > 0) { cX = e.touches[0].clientX; cY = e.touches[0].clientY; } else if (e.changedTouches && e.changedTouches.length > 0) { cX = e.changedTouches[0].clientX; cY = e.changedTouches[0].clientY; } return { x: (cX - r.left) * (canvas.width / r.width), y: (cY - r.top) * (canvas.height / r.height) }; }
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; if (canvas.width < 600) { box.w = canvas.width * 0.85; box.h = canvas.height * 0.25; box.y = 80; } else { box.w = 420; box.h = 260; box.y = 100; } box.x = (canvas.width - box.w) / 2; player.x = canvas.width / 2; player.y = canvas.height - 100; }
        
        function gameLoop() {
            if (canvas.style.display === "none") { gameLoopRunning = false; return; }
            gameLoopRunning = true;
            if (player.inAir) {
                player.progress += 0.03;
                player.x = player.startX + (player.targetX - player.startX) * player.progress + windX * player.progress * 15;
                player.y = player.startY + (player.targetY - player.startY) * player.progress + windY * player.progress * 15;
                player.z = Math.sin(player.progress * Math.PI) * player.arcHeight;
                player.r = player.baseR + player.z * 0.35;
                player.angleX += player.vx * 0.05; player.angleY += player.vy * 0.05; player.angle += 0.15;
                if (player.progress >= 1) {
                    player.x = player.targetX; player.y = player.targetY; player.z = 0; player.progress = 0; player.inAir = false; player.r = player.baseR;
                    playClickSound(0.5); let hitAny = false;
                    targets.forEach(t => {
                        if (!t.isOut) {
                            let dx = t.x - player.x, dy = t.y - player.y;
                            if (Math.sqrt(dx*dx + dy*dy) < (player.r + t.r)) {
                                hitAny = true;
                                let hitSpeed = Math.sqrt(player.vx*player.vx + player.vy*player.vy) || 5.5;
                                playClickSound(hitSpeed / 5);
                                t.vx = Math.cos(Math.atan2(dy, dx)) * (hitSpeed * 1.35);
                                t.vy = Math.sin(Math.atan2(dy, dx)) * (hitSpeed * 1.35);
                            }
                        }
                    });
                    if (!hitAny) { setTimeout(resetRound, 300); }
                }
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (imgBg.complete && imgBg.naturalWidth !== 0) ctx.drawImage(imgBg, 0, 0, canvas.width, canvas.height);
            else { ctx.fillStyle = currentGround.fallbackColor; ctx.fillRect(0, 0, canvas.width, canvas.height); }
            drawDynamicBorder();
            targets.forEach(t => {
                if (!t.isOut) {
                    t.x += t.vx; t.y += t.vy; t.vx *= currentGround.friction; t.vy *= currentGround.friction;
                    t.angleX += t.vx * 0.05; t.angleY += t.vy * 0.05; t.angle += (Math.abs(t.vx) + Math.abs(t.vy)) * 0.02;
                    if (t.x < box.x || t.x > box.x + box.w || t.y < box.y || t.y > box.y + box.h) {
                        t.isOut = true; targetOutInTurn = true;
                        if (!isQuickRandomMode) {
                            if(playerScores[currentPlayerIndex] !== undefined) { playerScores[currentPlayerIndex]++; } else { playerScores[currentPlayerIndex] = 1; }
                            let id = playerNationalIds[currentPlayerIndex] || "";
                            if (id === currentNationalId) { totalMarblesOwned++; } else if (id !== "") {
                                let cSubM = parseInt(localStorage.getItem(`marbles_${id}`)) || 0; localStorage.setItem(`marbles_${id}`, cSubM + 1);
                            }
                            updateWalletUI();
                        }
if (targets.filter(targetItem => !targetItem.isOut).length === 0) { 
    playStadiumGoalHornSound(); 
    setTimeout(showFinalScoreboard, 200); 
}
}
                    ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(t.angle); ctx.beginPath(); ctx.arc(0, 0, t.r, 0, Math.PI * 2); ctx.clip();
                    if (imgTarget.complete && imgTarget.naturalWidth !== 0) ctx.drawImage(imgTarget, -t.r, -t.r, t.r * 2, t.r * 2);
                    else { ctx.fillStyle = "#ff5722"; ctx.fill(); } ctx.restore();
                }
            });
            ctx.save(); ctx.translate(player.x, player.y - player.z); ctx.rotate(player.angle); ctx.beginPath(); ctx.arc(0, 0, player.r, 0, Math.PI * 2); ctx.clip();
            if (imgPlayer.complete && imgPlayer.naturalWidth !== 0) ctx.drawImage(imgPlayer, -player.r, -player.r, player.r * 2, player.r * 2);
            else { ctx.fillStyle = currentGround.fallbackColorPlayer || "#2196f3"; ctx.fill(); } ctx.restore();
            updateWeatherParticles(); drawWeather(); requestAnimationFrame(gameLoop);
        }

        function generateMenuPreviews() { Object.keys(grounds).forEach(key => { let pCanvas = document.getElementById(`pre_${key}`); if (pCanvas) { let pCtx = pCanvas.getContext("2d"); pCanvas.width = 70; pCanvas.height = 70; let tempImg = new Image(); tempImg.src = grounds[key].src; tempImg.onload = function() { pCtx.drawImage(tempImg, 0, 0, 70, 70); }; tempImg.onerror = function() { pCtx.fillStyle = grounds[key].fallbackColor; pCtx.fillRect(0, 0, 70, 70); }; } }); }
        function preloadAssetsAndLaunch() { showGameToast("⏳ در حال تدارک اتمسفر استادیوم..."); imgBg.src = currentGround.src || 'grass.jpg'; imgPlayer.src = '6.png'; imgTarget.src = '1.png'; runGameInitialization(); }
        function runGameInitialization() { if (gameLoopRunning) { resizeCanvas(); loadLevel(1); return; } setupMenu.style.display = "none"; canvas.style.display = "block"; gameHeader.style.display = "flex"; gearBtn.style.display = "none"; currentPlayerIndex = 0; playerScores = Array(selectedPlayerCount).fill(0); resizeCanvas(); isFirstShotOfTurn = true; hitSuccessInTurn = false; targetOutInTurn = false; hasBonusShot = false; isChainMode = false; loadLevel(1); initWeatherParticles(); initWindLines(); updateWalletUI(); gameLoopRunning = true; requestAnimationFrame(gameLoop); }
        function launchGameDirectly() { if (isQuickRandomMode) { preloadAssetsAndLaunch(); return; } for (let i = 0; i < selectedPlayerCount; i++) { let id = playerNationalIds[i] || ""; let pMarbles = (id === currentNationalId) ? totalMarblesOwned : (parseInt(localStorage.getItem(`marbles_${id}`)) || 0); if (pMarbles < selectedCountVal) { showCustomPopup(`❌ موجودی تیله ${playerNames[i]} کافی نیست! برای ورود به این مسابقه حداقل به ${selectedCountVal} تیله نیاز دارید.`, `🏪`, `ورود به فروشگاه مرکزی`, true, function() { settingsDrawer.classList.add("open"); overlay.style.display = "block"; openStadiumStoreModal(); }); return; } if (id === currentNationalId) { totalMarblesOwned -= selectedCountVal; localStorage.setItem(`marbles_${id}`, totalMarblesOwned); localStorage.setItem("totalMarblesOwned", totalMarblesOwned); } else if (id !== "") { localStorage.setItem(`marbles_${id}`, pMarbles - selectedCountVal); } } preloadAssetsAndLaunch(); }
