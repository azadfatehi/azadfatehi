<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>استادیوم آنلاین تیله‌بازی</title>
    
    <!-- 📱 اتصال شناسنامه اپلیکیشن موبایل جهت فعال‌سازی قابلیت نصب آفلاین PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- فراخوانی کتابخانه شبکه محلی Wi-Fi و Hotspot -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * { 
            box-sizing: border-box; user-select: none; -webkit-user-select: none; 
            margin: 0; padding: 0; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
        }
        body { 
            background-color: #111; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; 
            height: 100vh; height: -webkit-fill-available; font-family: sans-serif; color: white; overflow: hidden; touch-action: none;
        }
        #loginScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #25252d 0%, #111116 100%); background-image: url('menu_bg.jpg');
            background-size: cover; background-position: center; background-repeat: no-repeat; image-rendering: crisp-edges;
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; direction: rtl; padding: 20px;
        }
        #loginScreen::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.45); z-index: -1; }
        .login-box {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.2);
            padding: 30px; border-radius: 25px; width: 100%; max-width: 360px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); text-align: center;
        }
        .login-box h2 { color: #ffeb3b; margin-bottom: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); font-size: 21px; }
        .login-box input {
            width: 100%; padding: 12px 15px; margin: 8px 0; border-radius: 12px; border: 1px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.4); color: #fff; text-align: center; font-size: 14px; outline: none; user-select: text !important; -webkit-user-select: text !important;
        }
        .login-box input:focus { border-color: #ffeb3b; box-shadow: 0 0 10px rgba(255,235,59,0.3); }
        .login-btn { width: 100%; padding: 12px; border-radius: 12px; border: none; color: white; font-size: 15px; font-weight: bold; cursor: pointer; }
        .quick-btn {
            width: 100%; padding: 12px; border-radius: 12px; border: none; color: white; font-size: 14px; font-weight: bold; cursor: pointer;
            background: linear-gradient(90deg, #ff9800, #ff5722); margin-top: 10px; box-shadow: 0 4px 15px rgba(255,152,0,0.3);
        }
        .login-btn:active, .quick-btn:active { transform: scale(0.98); }
        #setupMenu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 20; padding: 20px; direction: rtl;
            background: radial-gradient(circle, #25252d 0%, #111116 100%); background-image: url('menu_bg.jpg'); background-size: cover; background-position: center;
        }
        #setupMenu::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); z-index: -1; }
        #gearBtn { position: absolute; top: 20px; left: 20px; background: rgba(255, 255, 255, 0.25); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; width: 50px; height: 50px; font-size: 22px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 25; }
        #startBtn { position: relative; width: 140px; height: 140px; border-radius: 50%; background-image: url('1.png'); background-size: cover; border: 4px solid #fff; color: white; font-size: 24px; font-weight: bold; cursor: pointer; z-index: 25; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(0,0,0,0.6); text-shadow: 0 2px 5px rgba(0,0,0,0.9); }
        #startBtn:active, #gearBtn:active { transform: scale(0.95); }
        
        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 30; display: none; }
        .drawer { 
            position: fixed; bottom: -100%; left: 0; width: 100%; max-height: 85vh; 
            background-image: linear-gradient(rgba(17, 17, 22, 0.91), rgba(17, 17, 22, 0.91)), url('menu_bg.jpg');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            padding: 20px; z-index: 31; transition: bottom 0.4s cubic-bezier(0.1, 1, 0.1, 1); overflow-y: auto; direction: rtl; display: flex; flex-direction: column; align-items: center; border-radius: 25px 25px 0 0; 
        }
        .drawer.open { bottom: 0; }
        .drawer-close-btn { background: #2196f3; border: none; color: white; padding: 14px 28px; width: 100%; max-width: 320px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 20px; }
        .menu-row { margin: 15px 0; text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center; }
        .menu-row label { display: block; font-size: 16px; margin-bottom: 10px; font-weight: bold; color: #ffeb3b; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .count-column-select { display: flex; justify-content: center; gap: 8px; width: 100%; max-width: 340px; flex-wrap: wrap; }
        .count-button-item { flex: 1; min-width: 75px; padding: 10px 5px; font-size: 12px; font-weight: bold; background: rgba(37,37,37,0.85); border: 2px solid #444; border-radius: 12px; color: white; cursor: pointer; text-align: center; }
        .count-button-item.active { background: #4caf50; border-color: #fff; box-shadow: 0 0 12px #4caf50; }
        .scroll-container { display: flex; justify-content: flex-start; overflow-x: auto; gap: 12px; padding: 10px 5px; width: 100%; max-width: 360px; -webkit-overflow-scrolling: touch; }
        .scroll-item { flex: 0 0 70px; border: 3px solid #555; border-radius: 12px; overflow: hidden; cursor: pointer; aspect-ratio: 1; background: rgba(0,0,0,0.4); position: relative; }
        .scroll-item canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
        .scroll-item.active { border-color: #4caf50; box-shadow: 0 0 15px #4caf50; }
        .custom-select { width: 100%; max-width: 260px; padding: 12px; font-size: 15px; font-weight: bold; background: rgba(37,37,37,0.9); border: 2px solid #555; border-radius: 12px; color: white; text-align: center; outline: none; cursor: pointer; }
        .name-input-container { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; margin-top: 5px; }
        .player-row-item { display: flex; flex-direction: column; gap: 5px; width: 100%; background: rgba(255,255,255,0.03); border: 1px solid #333; padding: 8px; border-radius: 14px; }
        .player-inputs { display: flex; gap: 6px; width: 100%; align-items: center; }
        .player-inputs input { flex: 1; padding: 10px; font-size: 13px; background: rgba(26,26,26,0.9); border: 2px solid #444; border-radius: 10px; color: white; text-align: center; user-select: text !important; -webkit-user-select: text !important; }
        .order-badge { width: 65px; padding: 10px 0; font-size: 12px; font-weight: bold; background: #333; border: 2px solid #555; border-radius: 10px; color: #aaa; text-align: center; }
        .order-badge.assigned { background: #ff9800; border-color: #fff; color: #000; box-shadow: 0 0 8px #ff9800; }
        /* 🛍️ استایل‌های منوی اختصاصی فروشگاه و صرافی دوطرفه تیله */
        .shop-container { width: 100%; max-width: 340px; background: rgba(255,255,255,0.04); border: 2px dashed rgba(255,235,59,0.3); border-radius: 18px; padding: 15px; margin-top: 10px; direction: rtl; }
        .shop-title { color: #ffeb3b; font-size: 15px; font-weight: bold; margin-bottom: 10px; text-align: center; }
        .shop-row { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 10px; margin: 6px 0; }
        .shop-row span { font-size: 13px; color: #fff; }
        .shop-actions { display: flex; gap: 6px; }
        .shop-btn { padding: 6px 12px; border-radius: 8px; border: none; font-size: 12px; font-weight: bold; cursor: pointer; color: white; }
        .shop-btn.buy { background: #4caf50; }
        .shop-btn.sell { background: #e53935; }
        .shop-btn:active { transform: scale(0.95); }

        #canvas { display: none; touch-action: none; image-rendering: crisp-edges; background-color: #222; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        #gameHeader { display: none; width: 90vw; max-width: 430px; justify-content: space-between; align-items: center; position: absolute; top: 15px; z-index: 10; direction: rtl; }
        #exitBtn { background: #e53935; color: white; border: none; border-radius: 12px; padding: 8px 18px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,0.3); }
        #turnIndicator { font-size: 16px; font-weight: bold; color: #ffeb3b; background: rgba(0,0,0,0.6); padding: 6px 14px; border-radius: 10px; }
        
        .lucky-wheel-btn { background: #ff9800; color: black; border: none; border-radius: 12px; padding: 10px 20px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .wheel-container { display: none; flex-direction: column; align-items: center; margin: 15px 0; position: relative; }
        .wheel-pointer { width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 20px solid #e53935; position: absolute; top: -5px; z-index: 5; }
        #wheelCanvas { border: 4px solid #fff; border-radius: 50%; }
        
        .custom-popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 150; padding: 20px; }
        .custom-popup-box { background: rgba(25, 30, 35, 0.9); backdrop-filter: blur(20px); border: 2px solid rgba(255, 235, 59, 0.5); border-radius: 25px; padding: 25px; width: 100%; max-width: 360px; text-align: center; direction: rtl; box-shadow: 0 20px 50px rgba(0,0,0,0.7); }
        .popup-icon { font-size: 45px; margin-bottom: 12px; display: inline-block; }
        .popup-text { font-size: 14px; line-height: 1.6; color: #fff; margin-bottom: 15px; }
        
        .final-table { width: 100%; margin: 15px 0; border-collapse: collapse; font-size: 13px; color: #fff; }
        .final-table th, .final-table td { padding: 8px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .final-actions { display: flex; gap: 10px; margin-top: 15px; width: 100%; }
        .popup-btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 14px; font-weight: bold; cursor: pointer; color: white; text-align: center; }
        .popup-btn.success { background: linear-gradient(90deg, #4caf50, #81c784); }
        .popup-btn.danger { background: linear-gradient(90deg, #ff5722, #ff8a65); }

        .game-toast { position: fixed; bottom: 25px; background: rgba(0,0,0,0.85); color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: bold; border: 1px solid rgba(255,255,255,0.15); z-index: 200; pointer-events: none; transition: opacity 0.3s ease, transform 0.3s ease; opacity: 0; transform: translateY(10px); direction: rtl; }
        .game-toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>
    <!-- 🟢 صفحه لاگین اول بازی: سه کلید مجزای ورود آنی، ثبت نام جدید و شروع سریع رندم -->
    <div id="loginScreen" style="display: flex;">
        <div class="login-box">
            <h2 id="authFormTitle">🏟️ به میدان تیله‌بازی خوش آمدید</h2>
            <input type="number" id="identifierInput" placeholder="کد ملی (۱۰ رقمی)">
            <input type="text" id="usernameInput" placeholder="نام و نام خانوادگی (فارسی)" style="display: none;">
            
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px; width: 100%;">
                <div style="display: flex; gap: 8px; width: 100%;">
                    <button class="login-btn" id="loginModeBtn" style="background: #2196f3; flex: 1;" onclick="processSmartAuth('login')">ورود به حساب</button>
                    <button class="login-btn" id="regModeBtn" style="background: #4caf50; flex: 1;" onclick="switchAuthModeToRegister()">ثبت نام جدید</button>
                </div>
                <button class="login-btn" id="authSubmitBtn" style="background: #9c27b0; font-size: 16px; display: none;" onclick="processSmartAuth('register')">تایید و ایجاد حساب</button>
                <button class="quick-btn" id="quickStartBtn" onclick="processQuickRandomAuth()">⚡ شروع سریع (رندم بدون حساب)</button>
            </div>
        </div>
    </div>
    <!-- 🟢 منوی اصلی بازی (فقط پس از لاگین نمایش داده می‌شود) -->
    <div id="setupMenu" style="display: none;">
        <button id="gearBtn">⚙️</button>
        <button id="startBtn">شروع</button>
    </div>

    <!-- 🏆 کادر پاپ‌آپ استادیومی جهت نمایش جوایز و جدول رده‌بندی مسابقات -->
    <div class="custom-popup-overlay" id="gamePopup">
        <div class="custom-popup-box">
            <span class="popup-icon" id="popupIcon">🎉</span>
            <div class="popup-text" id="popupText">متن پیام در اینجا قرار می‌گیرد.</div>
            <table class="final-table" id="finalScoreTable" style="display: none;">
                <thead>
                    <tr><th>بازیکن</th><th>تیله‌های خارج شده</th><th>بانک کل (تیله)</th></tr>
                </thead>
                <tbody id="finalTableBody"></tbody>
            </table>
            <div class="final-actions" id="popupActionButtons">
                <button class="popup-btn success" id="popupBtn" onclick="closeCustomPopup()">تایید و ادامه</button>
            </div>
        </div>
    </div>
    <div class="drawer-overlay" id="overlay"></div>
    <div class="drawer" id="settingsDrawer">
        
        <!-- 🔝 هدر بالای کشو شامل عنوان و کلید خروج نهایی به لاگین -->
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 360px; margin-top: 5px; margin-bottom: 20px; padding: 0 5px; direction: rtl;">
            <h3 style="color: #ffeb3b; font-size: 17px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.9);">⚙️ تنظیمات استادیوم</h3>
            <button style="background: #e53935; color: white; border: none; border-radius: 12px; padding: 8px 16px; font-size: 13px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,0.5);" onclick="handleDrawerExit()">خروج</button>
        </div>

        <!-- 🕹️ محتوای داخلی تنظیمات استادیوم -->
        <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <div class="menu-row">
                <label>کجا میخوای بازی کنیم؟</label>
                <div class="scroll-container" id="groundGrid">
                    <div class="scroll-item active" data-val="grass"><canvas id="pre_grass"></canvas></div>
                    <div class="scroll-item" data-val="carpet"><canvas id="pre_carpet"></canvas></div>
                    <div class="scroll-item" data-val="asphalt"><canvas id="pre_asphalt"></canvas></div>
                    <div class="scroll-item" data-val="cement"><canvas id="pre_cement"></canvas></div>
                    <div class="scroll-item" data-val="dirt"><canvas id="pre_dirt"></canvas></div>
                </div>
            </div>
            <div class="menu-row">
                <label>در چه هوایی بازی می چسبه؟</label>
                <div class="count-column-select" id="weatherGrid">
                    <div class="count-button-item active" data-val="sunny">☀️ آفتابی</div>
                    <div class="count-button-item" data-val="windy">💨 باد شدید</div>
                    <div class="count-button-item" data-val="rainy">🌧️ بارانی</div>
                    <div class="count-button-item" data-val="snowy">❄️ برفی</div>
                </div>
            </div>
            <!-- 🛍️ ماژول بومی فروشگاه و صرافی دوطرفه خرید/فروش آنی تیله -->
            <div class="shop-container">
                <div class="shop-title">💎 دکان و صرافی دوطرفه تیله‌بازی</div>
                
                <!-- ردیف خرید تیله هدیه/فوری -->
                <div class="shop-row">
                    <span>بسته ۱۰ تایی تیله (شارژ فوری حساب)</span>
                    <div class="shop-actions">
                        <button class="shop-btn buy" onclick="handleShopTransaction('buy', 10)">🛒 خرید</button>
                    </div>
                </div>

                <!-- ردیف فروش تیله به صرافی -->
                <div class="shop-row">
                    <span>فروش ۱۰ تیله به صرافی بازی</span>
                    <div class="shop-actions">
                        <button class="shop-btn sell" onclick="handleShopTransaction('sell', 10)">💰 فروش</button>
                    </div>
                </div>
            </div>
            <div class="menu-row">
                <label>دوست داری چند نفره باشیم؟ (آفلاین نوبتی)</label>
                <select class="custom-select" id="playerCountSelect">
                    <option value="1" selected>۱ نفره (انفرادی تنهایی)</option>
                    <option value="2">۲ نفره</option><option value="3">۳ نفره</option>
                    <option value="4">۴ نفره</option><option value="5">۵ نفره</option><option value="6">۶ نفره</option>
                </select>
            </div>
            <div class="name-input-container" id="namesContainer" style="margin-top: 15px; margin-bottom: 5px;">
                <div class="player-row-item">
                    <div class="player-inputs">
                        <input type="text" id="pInput0" value="بازیکن ۱" placeholder="نام فارسی بازیکن ۱" disabled>
                    </div>
                </div>
            </div>
            <button class="lucky-wheel-btn" id="drawOrderBtn" style="display: none;">🎰 ببینیم نوبت اول کیه ؟</button>
            <div class="wheel-container" id="wheelSection">
                <div class="wheel-pointer"></div>
                <canvas id="wheelCanvas" width="240" height="240"></canvas>
            </div>

            <!-- 🏢 بخش مسابقه آفلاین چند گوشی با شبکه داخلی وای‌فای و هات‌اسپات -->
            <div class="menu-row" style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; width: 100%; max-width: 340px; margin-top: 10px;">
                <label style="color: #00e676;">🎮 بخش مسابقه آفلاین چند گوشی (Wi-Fi/Hotspot)</label>
                <div style="display: flex; gap: 8px; width: 100%; margin-bottom: 8px;">
                    <button id="createRoomBtn" style="flex: 1; background: #2196f3; color: white; border: none; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer;" onclick="initOnlineMatch('create')">🏢 ساخت اتاق</button>
                    <button id="joinRoomBtn" style="flex: 1; background: #00e676; color: black; border: none; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer;" onclick="initOnlineMatch('join')">🔑 ورود به اتاق</button>
                </div>
                <input type="text" id="roomCodeInput" placeholder="کد اتاق ۴ رقمی (مثلاً: 4582)" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #555; background: #111; color: white; text-align: center; outline: none;">
            </div>

            <div class="menu-row">
                <label>با چند تا تیله بریم بازی?</label>
                <select class="custom-select" id="marbleCountSelect">
                    <option value="2">۲ تیله</option><option value="3">۳ تیله</option><option value="4">۴ تیله</option>
                    <option value="5" selected>۵ تیله</option><option value="6">۶ تیله</option><option value="7">۷ تیله</option>
                    <option value="8">۸ تیله</option><option value="9">۹ تیله</option><option value="10">۱۰ تیله</option>
                </select>
            </div>
            <button class="drawer-close-btn" id="closeDrawer" style="margin-top: 15px; margin-bottom: 10px;">همه چی عالی شد!     بریم؟</button>
        </div>
    </div>

    <!-- هدر بالای میدان شامل دکمه خروج نهایی و برگشت به منو به همراه وضعیت نوبت و بانک بازیکن -->
    <div id="gameHeader">
        <div style="display: flex; gap: 8px;">
            <button id="exitBtn" style="background: #e53935; color: white; border: none; border-radius: 12px; padding: 8px 18px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,0.3);">خروج</button>
            <button id="backToMenuBtn" style="background: #ff9800; color: black; border: none; border-radius: 12px; padding: 8px 14px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,0.3);" onclick="handleBackToMenu()">برگشت به منو</button>
        </div>
        <div id="turnIndicator">نوبت: بازیکن ۱</div>
    </div>

    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const setupMenu = document.getElementById("setupMenu");
        const startBtn = document.getElementById("startBtn");
        const gearBtn = document.getElementById("gearBtn");
        const settingsDrawer = document.getElementById("settingsDrawer");
        const overlay = document.getElementById("overlay");
        const closeDrawer = document.getElementById("closeDrawer");
        const gameHeader = document.getElementById("gameHeader");
        const exitBtn = document.getElementById("exitBtn"); 
        const namesContainer = document.getElementById("namesContainer");
        const turnIndicator = document.getElementById("turnIndicator");

        let totalMarblesOwned = parseInt(localStorage.getItem("totalMarblesOwned")) || 10;
        let freeShopClaims = parseInt(localStorage.getItem("freeShopClaims")) || 0; 
        let currentUsername = localStorage.getItem("currentUsername") || "";
        let currentNationalId = localStorage.getItem("currentNationalId") || "";
        let authMode = "login"; 
        let gameLoopRunning = false; 
        let isQuickRandomMode = false; 
        
        let playerNames = ["بازیکن ۱"];

        function startAmbientSound(weather) {

                let id = playerNationalIds[currentPlayerIndex] || "";
                let pMarbles = id === currentNationalId ? totalMarblesOwned : (parseInt(localStorage.getItem(`marbles_${id}`)) || 0);
                turnIndicator.innerText = `نوبت: ${playerNames[currentPlayerIndex]} (بانک: ${pMarbles})`;
            } else {
                turnIndicator.innerText = "🎯 میدان تمرین انفرادی";
            }
            
            if (!gameLoopRunning) { gameLoopRunning = true; requestAnimationFrame(gameLoop); }
        }

        function launchGameDirectly() {
            let currentInGamePlayerName = "بازیکن";
            if (playerNames && playerNames[currentPlayerIndex]) { currentInGamePlayerName = playerNames[currentPlayerIndex]; } 
            else {
                let uNameInput = document.getElementById("usernameInput");
                currentInGamePlayerName = (uNameInput && uNameInput.value.trim() !== "") ? uNameInput.value.trim() : (currentUsername || "بازیکن");
            }
            if (!isQuickRandomMode && !(typeof conn !== 'undefined' && conn) && totalMarblesOwned < selectedCountVal) {
                showCustomPopup(`اوپس! موجودی کافی نیست، ${currentInGamePlayerName}.\nهزینه مسابقه ${selectedCountVal} تیله است اما دارایی شما ${totalMarblesOwned} عدد می‌باشد!`, "💎", "💸 شارژ فوری ۱۰ تیله هدیه", true, function() { totalMarblesOwned += 10; updateWalletUI(); showCustomPopup("بانک شما با موفقیت شارژ شد!", "⚡", "شروع بازی"); });
                return;
            }
            if (!isQuickRandomMode && !(typeof conn !== 'undefined' && conn)) totalMarblesOwned -= selectedCountVal;
            preloadAssetsAndLaunch();
        }

        // 🏢 موتور اصلاح‌شده مسابقه آفلاین چند گوشی بر بستر شبکه داخلی وای‌فای و هات‌اسپات (بدون نیاز به اینترنت جهانی)
        function initOnlineMatch(type) {
            let code = document.getElementById("roomCodeInput").value.trim();
            if (code === "") { showCustomPopup("لطفاً یک کد اتاق ۴ رقمی وارد کنید.", "⚠️", "فهمیدم", true); return; }
            isQuickRandomMode = false;

            let localIP = prompt("لطفاً آی‌پی (IP) گوشی میزبان (صاحب هات‌اسپات) را وارد کنید:", "192.168.43.1");
            if(!localIP) return;

            if (type === 'create') {
                peer = new Peer('tile-game-' + code, {
                    host: localIP,
                    port: 9000,
                    path: '/myapp',
                    secure: false
                });
                showGameToast("⏳ اتاق محلی ساخته شد. منتظر اتصال گوشی‌های دیگر روی وای‌فای...");
                peer.on('open', () => { showCustomPopup(`اتاق وای‌فای ساخته شد!\nکد اتاق: ${code}\nدیگران به هات‌اسپات شما متصل شوند.`, "🏢", "منتظر می‌مانم"); });
                peer.on('connection', (connection) => {
                    conn = connection; isMyTurnOnline = true; setupOnlineListeners();
                    showGameToast("🚀 گوشی حریف متصل شد! شروع مسابقه آفلاین محلی..."); closeCustomPopup();
                    settingsDrawer.classList.remove("open"); overlay.style.display = "none"; launchGameDirectly();
                });
                peer.on('error', (err) => {
                    console.log("Local Mode Active");
                    isMyTurnOnline = true; launchGameDirectly();
                });
            } 
            else if (type === 'join') {
                peer = new Peer({
                    host: localIP,
                    port: 9000,
                    path: '/myapp',
                    secure: false
                });
                showGameToast("⏳ در حال جستجوی گوشی میزبان روی شبکه وای‌فای...");
                peer.on('open', () => {
                    conn = peer.connect('tile-game-' + code); isMyTurnOnline = false; setupOnlineListeners();
                });
            }
        }
        function setupOnlineListeners() {
            conn.on('open', () => {
                showGameToast("✅ با موفقیت به حریف متصل شدید!"); closeCustomPopup();
                settingsDrawer.classList.remove("open"); overlay.style.display = "none"; launchGameDirectly();
            });
            conn.on('data', (data) => {
                if (data.type === 'shoot') {
                    player.startX = player.x; player.startY = player.y; player.targetX = data.cX; player.targetY = data.cY; player.arcHeight = data.arc; player.progress = 0; player.inAir = true;
                    if (data.hitTarget && targets[data.hitTarget.index]) {
                        let tHit = targets[data.hitTarget.index]; let hitSpeed = data.hitTarget.speed; let angle = data.hitTarget.angle; let steps = 0;
                        let opponentSlideInterval = setInterval(() => {
                            tHit.x += Math.cos(angle) * hitSpeed; tHit.y += Math.sin(angle) * hitSpeed; hitSpeed *= 0.94; steps++;
                            if (tHit.x < box.x || tHit.x > box.x + box.w || tHit.y < box.y || tHit.y > box.y + box.h) {
                                tHit.isOut = true;
                                let activeTargets = targets.filter(t => !t.isOut).length;
                                if (activeTargets === 0) { clearInterval(opponentSlideInterval); player.vx = 0; player.vy = 0; player.inAir = false; isMoving = false; playStadiumGoalHornSound(); setTimeout(showFinalScoreboard, 200); return; }
                            }
                            if (steps > 60 || hitSpeed < 0.5 || tHit.isOut) { clearInterval(opponentSlideInterval); }
                        }, 16);
                    }
                    isMyTurnOnline = true; turnIndicator.innerText = "🎯 نوبت شماست! شلیک کنید."; showGameToast("🎯 نوبت شماست!");
                }
            });
        }

        // 🎛️ مدیریت تفکیک دکمه‌های هدر بازی و منوی کشویی
        function handleBackToMenu() {
            if (typeof initAudio === "function") initAudio(); stopAmbientSound();
            canvas.style.display = "none"; gameHeader.style.display = "none"; document.getElementById("loginScreen").style.display = "none"; gameLoopRunning = false; 
            if (isQuickRandomMode || (typeof conn !== 'undefined' && conn)) {
                if (typeof conn !== 'undefined' && conn) { conn.close(); conn = null; } if (typeof peer !== 'undefined' && peer) { peer.destroy(); peer = null; }
                document.getElementById("loginScreen").style.display = "flex";
            } else { setupMenu.style.display = "flex"; }
        }

        function handleFinalExit() {
            if (typeof initAudio === "function") initAudio(); stopAmbientSound();
            if (typeof conn !== 'undefined' && conn) { conn.close(); conn = null; } if (typeof peer !== 'undefined' && peer) { peer.destroy(); peer = null; }
            canvas.style.display = "none"; gameHeader.style.display = "none"; setupMenu.style.display = "none";
            document.getElementById("loginScreen").style.display = "flex"; playerNames = []; playerOrders = []; playerNationalIds = []; gameLoopRunning = false; 
        }

        function handleDrawerExit() { handleFinalExit(); settingsDrawer.classList.remove("open"); overlay.style.display = "none"; }

        // 🟢 فعال‌سازی قطعی کلید بریم و دکمه شروع بازی دایره‌ای بدون هیچ باگی
        closeDrawer.onclick = () => { initAudio(); if(!saveSubPlayersData()) return; settingsDrawer.classList.remove("open"); overlay.style.display = "none"; startAmbientSound(selectedWeather); launchGameDirectly(); };
        startBtn.onclick = () => { if (typeof initAudio === "function") initAudio(); isQuickRandomMode = false; startAmbientSound(selectedWeather); launchGameDirectly(); };
        gearBtn.onclick = () => { initAudio(); settingsDrawer.classList.add("open"); overlay.style.display = "block"; };
        overlay.onclick = () => { settingsDrawer.classList.remove("open"); overlay.style.display = "none"; };
        exitBtn.onclick = function(e) { e.preventDefault(); e.stopPropagation(); handleFinalExit(); };

        function setupGridSelector(containerId, activeClass, callback) {
            const container = document.getElementById(containerId); if(!container) return;
            container.addEventListener('click', (e) => {
                const item = e.target.closest('[data-val]'); if (!item) return;
                container.querySelectorAll('[data-val]').forEach(i => i.classList.remove(activeClass));
                item.classList.add(activeClass); callback(item.getAttribute('data-val'));
            });
        }

        // 📱 ثبت رویدادهای مالتی‌پلتفرم (همزمان فعال برای لمس موبایل و کلیک دسکتاپ)
        canvas.addEventListener("mousedown", handleStart); canvas.addEventListener("mousemove", handleMove); canvas.addEventListener("mouseup", handleEnd);
        canvas.addEventListener("touchstart", handleStart, { passive: false }); canvas.addEventListener("touchmove", handleMove, { passive: false }); canvas.addEventListener("touchend", handleEnd, { passive: false });
        
        setupGridSelector('groundGrid', 'active', (val) => { selectedGroundVal = val; currentGround = grounds[val]; });
        setupGridSelector('weatherGrid', 'active', (val) => { selectedWeather = val; if(val === 'sunny') { windX = 0; windY = 0; } else if(val === 'windy') { windX = 0.08; windY = 0.02; } else if(val === 'rainy') { windX = 0.03; windY = 0.05; } else { windX = 0.01; windY = 0.02; } });
        document.getElementById("playerCountSelect").onchange = (e) => { selectedPlayerCount = parseInt(e.target.value); updateNameInputs(selectedPlayerCount); };
        document.getElementById("marbleCountSelect").onchange = (e) => { selectedCountVal = parseInt(e.target.value); };
        
        function showCustomPopup(text, icon, btnText, isError, callback) {
            const popup = document.getElementById("gamePopup"); const pText = document.getElementById("popupText"); const pIcon = document.getElementById("popupIcon");
            const pTable = document.getElementById("finalScoreTable"); const pAction = document.getElementById("popupActionButtons");
            if(!popup) return; if(pTable) pTable.style.display = "none"; if(pText) pText.innerText = text; if(pIcon) pIcon.innerText = icon || "🎉";
            if(pAction) {
                pAction.innerHTML = ""; if (btnText !== "") { const btn = document.createElement("button"); btn.className = isError ? "popup-btn danger" : "popup-btn success"; btn.innerText = btnText || "تایید"; btn.onclick = function() { popup.style.display = "none"; if(typeof callback === "function") callback(); }; pAction.appendChild(btn); }
            }
            popup.style.display = "flex";
        }

        function closeCustomPopup() { const popup = document.getElementById("gamePopup"); if(popup) popup.style.display = "none"; }
        
        // 🟢 فعال‌سازی رسمی موتور لودینگ آفلاین PWA در مرورگر موبایل
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('حالت آفلاین PWA فعال شد'))
                    .catch(err => console.log('خطا در سرویس‌ورکر', err));
            });
        }

        window.addEventListener("DOMContentLoaded", () => { generateMenuPreviews(); resizeCanvas(); if(currentNationalId){ playerNationalIds = [currentNationalId]; playerNames = [currentUsername || "بازیکن ۱"]; } });
        window.addEventListener("resize", resizeCanvas);
    </script>
</body>
</html>
