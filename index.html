<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تیله بازی پیشرفته تمام‌صفحه</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body { 
            background-color: #111; margin: 0; padding: 0; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; font-family: sans-serif; color: white; overflow: hidden;
        }
        /* منوی اصلی با فیلتر ضد تاری و وضوح بالا */
        #setupMenu {
            position: absolute; background-color: #3e2723;
            background-image: url('menu_bg.jpg'); 
            background-size: cover; background-position: center;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            width: 100%; height: 100%; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 20; padding: 20px;
            direction: rtl; overflow-y: auto;
        }
        #setupMenu::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); z-index: -1;
        }
        #setupMenu h2 { color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); margin-bottom: 20px; font-size: 26px; }
        .menu-row { margin: 12px 0; text-align: center; width: 100%; max-width: 360px; }
        .menu-row label { display: block; font-size: 16px; margin-bottom: 10px; font-weight: bold; color: #ffeb3b; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        
        /* نوار اسکرول افقی آزاد روی موبایل */
        .scroll-container { 
            display: flex; overflow-x: auto; gap: 12px; padding: 10px 5px; 
            width: 100%; scroll-behavior: smooth;
            touch-action: pan-x !important; 
            -webkit-overflow-scrolling: touch;
        }
        .scroll-container::-webkit-scrollbar { display: none; }
        
        .scroll-item { 
            flex: 0 0 100px; border: 3px solid #555; border-radius: 12px; 
            overflow: hidden; cursor: pointer; position: relative; aspect-ratio: 1; 
            display: flex; flex-direction: column; justify-content: flex-end;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4); transition: transform 0.2s; background: #2e7d32;
        }
        .scroll-item canvas { width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; z-index: 1; }
        .scroll-item span { 
            background: rgba(0,0,0,0.8); font-size: 11px; padding: 4px 0; text-align: center; 
            width: 100%; z-index: 2; font-weight: bold; color: #fff;
        }
        .scroll-item.active { border-color: #4caf50; box-shadow: 0 0 15px #4caf50; transform: scale(1.05); }

        .grid-select { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 5px; }
        .grid-item { 
            border: 3px solid #555; border-radius: 8px; overflow: hidden; cursor: pointer; 
            position: relative; aspect-ratio: 1; display: flex; flex-direction: column; justify-content: flex-end;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); background: #222;
        }
        .grid-item canvas { width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; z-index: 1; }
        .grid-item span { 
            background: rgba(0,0,0,0.75); font-size: 11px; padding: 3px 0; text-align: center; 
            width: 100%; z-index: 2; font-weight: bold; color: #fff;
        }
        .grid-item.active { border-color: #4caf50; box-shadow: 0 0 12px #4caf50; }

        #startBtn { 
            margin-top: 25px; padding: 14px 60px; font-size: 18px; font-weight: bold;
            background: #4caf50; color: white; border: none; border-radius: 25px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        #canvas { 
            border: 4px solid white; box-shadow: 0 0 15px rgba(0,0,0,0.5); display: none; 
            touch-action: none;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        #info { margin-bottom: 5px; font-size: 18px; font-weight: bold; text-align: center; display: none; width: 100%; max-width: 400px; direction: rtl;}
        .stats-bar { display: flex; justify-content: space-around; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 10px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div id="setupMenu">
        <h2>تیله بازی مرحله‌ای</h2>
        
        <div class="menu-row">
            <label>انتخاب زمین بازی (ورق بزنید ↔️):</label>
            <div class="scroll-container" id="groundGrid">
                <div class="scroll-item active" data-val="grass">
                    <canvas id="pre_grass"></canvas>
                    <span>چمن</span>
                </div>
                <div class="scroll-item" data-val="carpet">
                    <canvas id="pre_carpet"></canvas>
                    <span>فرش</span>
                </div>
                <div class="scroll-item" data-val="asphalt">
                    <canvas id="pre_asphalt"></canvas>
                    <span>آسفالت</span>
                </div>
                <div class="scroll-item" data-val="cement">
                    <canvas id="pre_cement"></canvas>
                    <span>سیمان</span>
                </div>
                <div class="scroll-item" data-val="dirt">
                    <canvas id="pre_dirt"></canvas>
                    <span>خاکی</span>
                </div>
            </div>
        </div>

        <div class="menu-row" style="margin-top: 10px;">
            <label>شکل تیله هدف:</label>
            <div class="grid-select" id="targetGrid">
                <div class="grid-item active" data-val="red">
                    <canvas id="pre_t_red"></canvas>
                    <span>تیله ۱</span>
                </div>
                <div class="grid-item" data-val="green">
                    <canvas id="pre_t_green"></canvas>
                    <span>تیله ۲</span>
                </div>
                <div class="grid-item" data-val="gold">
                    <canvas id="pre_t_gold"></canvas>
                    <span>تیله ۳</span>
                </div>
            </div>
        </div>

        <button id="startBtn">شروع مرحله ۱ 🎯</button>
    </div>

    <div id="info">
        <div class="stats-bar">
            <div>مرحله: <span id="lvlTxt">1</span></div>
            <div>شلیک باقی‌مانده: <span id="shotsTxt">3</span></div>
            <div>تیله‌های هدف: <span id="remTxt">3</span></div>
        </div>
        <div id="msg" style="color: #ffeb3b; font-size: 15px; text-align: center; display: none;">جایزه! ضربه دقیق بود، دوباره بزن 🎯</div>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const setupMenu = document.getElementById("setupMenu");
        const startBtn = document.getElementById("startBtn");
        const lvlTxt = document.getElementById("lvlTxt");
        const shotsTxt = document.getElementById("shotsTxt");
        const remTxt = document.getElementById("remTxt");
        const msgSlot = document.getElementById("msg");

        let currentLevel = 1;
        let shotsLeft = 3;
        let isAiming = false;
        let isMoving = false;
        let hitSuccessInTurn = false;
        
        let dragStart = { x: 0, y: 0 };
        let dragEnd = { x: 0, y: 0 };
        let windX = 0; 

        // تنظیم کادر بسته بر اساس ابعاد استاندارد
        const box = { x: 60, y: 80, w: 280, h: 220 };
        let player = { x: 200, y: 440, r: 24, vx: 0, vy: 0 }; 
        let targets = [];

        // تعریف مشخصات زمین‌ها، تصاویر، فیزیک و مدل خط‌کشی کادر هر زمین
        const grounds = {
            grass: { friction: 0.96, wind: 0.08, src: 'grass.jpg', borderStyle: 'rope', borderColor: '#ffffff', borderWidth: 4 },
            carpet: { friction: 0.97, wind: 0.02, src: 'carpet.jpg', borderStyle: 'thread', borderColor: '#ffeb3b', borderWidth: 2 },
            asphalt: { friction: 0.93, wind: 0.05, src: 'asphalt.jpg', borderStyle: 'chalk', borderColor: 'rgba(240,240,240,0.85)', borderWidth: 8 },
            cement: { friction: 0.98, wind: 0.04, src: 'cement.jpg', borderStyle: 'marker', borderColor: '#111111', borderWidth: 5 },
            dirt: { friction: 0.94, wind: 0.15, src: 'dirt.jpg', borderStyle: 'scratched', borderColor: '#4e342e', borderWidth: 6 }
        };

        let currentGround = grounds.grass;
        let imgBg = new Image();
        
        let imgPlayer = new Image();
        imgPlayer.src = '6.png'; 
        
        let imgTarget = new Image();

        let selectedGroundVal = "grass";
        let selectedTargetSrc = "1.png"; 

        // تنظیم اندازه تمام‌صفحه بوم بازی به صورت پویا
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.x = canvas.width / 2;
            player.y = canvas.height - 80;
        }
        window.addEventListener('resize', resizeCanvas);

        function generateMenuPreviews() {
            setupMenu.style.backgroundImage = "url('menu_bg.jpg')";
            
            let applyImgToGrid = (id, src) => {
                let cnv = document.getElementById(id);
                if(cnv) {
                    let cCtx = cnv.getContext("2d");
                    let img = new Image();
                    img.src = src;
                    img.onload = () => {
                        cnv.width = 100; cnv.height = 100;
                        cCtx.drawImage(img, 0, 0, 100, 100);
                    };
                }
            };
            
            applyImgToGrid("pre_grass", "grass.jpg");
            applyImgToGrid("pre_carpet", "carpet.jpg");
            applyImgToGrid("pre_asphalt", "asphalt.jpg");
            applyImgToGrid("pre_cement", "cement.jpg");
            applyImgToGrid("pre_dirt", "dirt.jpg");
            
            applyImgToGrid("pre_t_red", "1.png");
            applyImgToGrid("pre_t_green", "2.png");
            applyImgToGrid("pre_t_gold", "3.png");
        }

        function setupGridSelection(gridId, isScroll, callback) {
            const className = isScroll ? ".scroll-item" : ".grid-item";
            const items = document.querySelectorAll(`#${gridId} ${className}`);
            items.forEach(item => {
                item.addEventListener("click", () => {
                    document.querySelector(`#${gridId} ${className}.active`).classList.remove("active");
                    item.classList.add("active");
                    callback(item.getAttribute("data-val"));
                });
            });
        }

        window.addEventListener("DOMContentLoaded", () => {
            generateMenuPreviews();
            setupGridSelection("groundGrid", true, (val) => { selectedGroundVal = val; });
            setupGridSelection("targetGrid", false, (val) => {
                if (val === "red") selectedTargetSrc = "1.png";
                if (val === "green") selectedTargetSrc = "2.png";
                if (val === "gold") selectedTargetSrc = "3.png";
            });
        });

        startBtn.addEventListener("click", () => {
            currentGround = grounds[selectedGroundVal];
            imgBg.src = currentGround.src;
            imgTarget.src = selectedTargetSrc;

            setupMenu.style.display = "none";
            canvas.style.display = "block";
            document.getElementById("info").style.display = "block";
            
            resizeCanvas(); 
            loadLevel(currentLevel);
        });

        function loadLevel(lvl) {
            player.x = canvas.width / 2;
            player.y = canvas.height - 80;
            player.vx = 0; player.vy = 0;
            targets = [];
            
            // قرار دادن کادر دقیقا در مرکز صفحه افقی موبایل
            box.x = (canvas.width - box.w) / 2;
            box.y = (canvas.height - box.h) / 2 - 40;
            
            let cx = box.x + box.w / 2;
            let cy = box.y + box.h / 2;
            
            if (lvl === 1) {
                shotsLeft = 4;
                targets.push({ x: cx, y: cy, r: 14, vx: 0, vy: 0, isOut: false });
                targets.push({ x: cx - 25, y: cy, r: 14, vx: 0, vy: 0, isOut: false });
            } else if (lvl === 2) {
                shotsLeft = 3;
                targets.push({ x: cx, y: cy - 20, r: 14, vx: 0, vy: 0, isOut: false });
                targets.push({ x: cx - 25, y: cy + 20, r: 14, vx: 0, vy: 0, isOut: false });
                targets.push({ x: cx + 25, y: cy + 20, r: 14, vx: 0, vy: 0, isOut: false });
            } else if (lvl === 3) {
                shotsLeft = 3;
                targets.push({ x: cx, y: cy, r: 14, vx: 0, vy: 0, isOut: false });
                targets.push({ x: cx - 35, y: cy - 25, r: 14, vx: 0, vy: 0, isOut: false });
                targets.push({ x: cx + 35, y: cy - 25, r: 14, vx: 0, vy: 0, isOut: false });
                targets.push({ x: cx, y: cy + 35, r: 14, vx: 0, vy: 0, isOut: false });
            } else if (lvl === 4) {
                shotsLeft = 4;
                for (let i = 0; i < 5; i++) {
                    targets.push({ x: cx - 50 + (i * 25), y: cy - 30 + (i * 15), r: 14, vx: 0, vy: 0, isOut: false });
                }
            } else { 
                shotsLeft = 3;
                targets.push({ x: cx, y: cy, r: 14, vx: 0, vy: 0, isOut: false });
                targets.push({ x: cx - 30, y: cy - 30, r: 14, vx: 0, vy: 0, isOut: false });
                targets.push({ x: cx + 30, y: cy - 30, r: 14, vx: 0, vy: 0, isOut: false });
                targets.push({ x: cx - 30, y: cy + 30, r: 14, vx: 0, vy: 0, isOut: false });
                targets.push({ x: cx + 30, y: cy + 30, r: 14, vx: 0, vy: 0, isOut: false });
            }

            updateUI();
            if (lvl === 1) gameLoop();
        }

        function updateUI() {
            lvlTxt.innerText = currentLevel;
            shotsTxt.innerText = shotsLeft;
            remTxt.innerText = targets.filter(t => !t.isOut).length;
        }
        function resetRound() {
            player.x = canvas.width / 2;
            player.y = canvas.height - 80;
            player.vx = 0; player.vy = 0;
            windX = (Math.random() - 0.5) * currentGround.wind;
            isMoving = false;

            let activeTargets = targets.filter(t => !t.isOut).length;

            if (activeTargets === 0) {
                alert("آفرین! مرحله " + currentLevel + " را با موفقیت رد کردی! 🎉");
                currentLevel++;
                if (currentLevel > 5) {
                    alert("تبریک فراوان! شما تمام مراحل را با موفقیت تمام کردید و قهرمان کل بازی شدید! 🏆");
                    currentLevel = 1;
                    setupMenu.style.display = "flex";
                    canvas.style.display = "none";
                    document.getElementById("info").style.display = "none";
                } else {
                    loadLevel(currentLevel);
                }
            } 
            else if (shotsLeft <= 0 && !hitSuccessInTurn) {
                alert("شلیک‌های شما در این مرحله تمام شد! دوباره تلاش کنید. ↩️");
                loadLevel(currentLevel);
            }

            hitSuccessInTurn = false;
            updateUI();
        }

        // تابع اختصاصی و هوشمند برای رسم خط کادر دور تیله‌ها متناسب با هر زمین
        function drawDynamicBorder() {
            ctx.save();
            ctx.strokeStyle = currentGround.borderColor;
            ctx.lineWidth = currentGround.borderWidth;

            if (currentGround.borderStyle === 'chalk') {
                // افکت خط گچی روی آسفالت: خط پهن، کدر و مقطع با سایه سفید ملایم
                ctx.setLineDash([12, 6, 18, 4]);
                ctx.shadowColor = "rgba(255,255,255,0.4)";
                ctx.shadowBlur = 4;
                ctx.strokeRect(box.x, box.y, box.w, box.h);
            } 
            else if (currentGround.borderStyle === 'marker') {
                // افکت خط ماژیکی روی سیمان: خط مشکی ضخیم و یکدست
                ctx.setLineDash([]);
                ctx.strokeRect(box.x, box.y, box.w, box.h);
            } 
            else if (currentGround.borderStyle === 'scratched') {
                // افکت خط خراشیدگی/چوب روی زمین خاکی: رسم خط لرزان و نامنظم
                ctx.beginPath();
                let steps = 15;
                let stepW = box.w / steps;
                let stepH = box.h / steps;
                
                // ضلع بالا با لرزش تصادفی
                ctx.moveTo(box.x, box.y);
                for (let i = 1; i <= steps; i++) { ctx.lineTo(box.x + i * stepW, box.y + (Math.random() - 0.5) * 3); }
                // ضلع راست
                for (let i = 1; i <= steps; i++) { ctx.lineTo(box.x + box.w + (Math.random() - 0.5) * 3, box.y + i * stepH); }
                // ضلع پایین
                for (let i = 1; i <= steps; i++) { ctx.lineTo(box.x + box.w - i * stepW, box.y + box.h + (Math.random() - 0.5) * 3); }
                // ضلع چپ
                for (let i = 1; i <= steps; i++) { ctx.lineTo(box.x + (Math.random() - 0.5) * 3, box.y + box.h - i * stepH); }
                
                ctx.closePath();
                ctx.stroke();
            } 
            else if (currentGround.borderStyle === 'thread') {
                // افکت خط نخی ریز روی فرش
                ctx.setLineDash([4, 4]);
                ctx.strokeRect(box.x, box.y, box.w, box.h);
            } 
            else {
                // خط طنابی ساده روی چمن
                ctx.setLineDash([15, 8]);
                ctx.strokeRect(box.x, box.y, box.w, box.h);
            }
            
            ctx.restore();

            // یک سایه تاریک ملایم برای مشخص‌تر شدن فضای بازی وسط زمین تمام‌صفحه
            ctx.fillStyle = "rgba(0, 0, 0, 0.12)";
            ctx.fillRect(box.x, box.y, box.w, box.h);
        }

        function gameLoop() {
            let anyMoving = false;
            player.r = 24; 

            if (Math.abs(player.vx) > 0.05 || Math.abs(player.vy) > 0.05) {
                player.vx += windX; player.x += player.vx; player.y += player.vy;
                player.vx *= currentGround.friction; player.vy *= currentGround.friction; 
                anyMoving = true;
            } else { player.vx = 0; player.vy = 0; }

            targets.forEach(t => {
                if (!t.isOut) {
                    if (Math.abs(t.vx) > 0.05 || Math.abs(t.vy) > 0.05) {
                        t.x += t.vx; t.y += t.vy;
                        t.vx *= currentGround.friction; t.vy *= currentGround.friction;
                        anyMoving = true;
                    } else { t.vx = 0; t.vy = 0; }

                    let dx = t.x - player.x; let dy = t.y - player.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if (dist < player.r + t.r) {
                        let angle = Math.atan2(dy, dx);
                        let speed = Math.sqrt(player.vx*player.vx + player.vy*player.vy);
                        t.vx = Math.cos(angle) * speed * 0.85; t.vy = Math.sin(angle) * speed * 0.85;
                        player.vx *= -0.2; player.vy *= -0.2; 
                    }

                    if (t.x < box.x || t.x > box.x + box.w || t.y < box.y || t.y > box.y + box.h) {
                        t.isOut = true;
                        hitSuccessInTurn = true;
                    }
                }
            });

            if (isMoving && !anyMoving) {
                if (hitSuccessInTurn) {
                    msgSlot.style.display = "block";
                } else {
                    msgSlot.style.display = "none";
                    shotsLeft--; 
                }
                updateUI();
                setTimeout(resetRound, 400);
            }
            if (anyMoving) isMoving = true;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // ۱. رسم پس‌زمینه تصویر زمین بازی شما به صورت کاملاً تمام‌صفحه
            if (imgBg.complete && imgBg.naturalWidth !== 0) {
                ctx.drawImage(imgBg, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = "#256329"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // ۲. رسم هوشمند خطوط کادر بازی متناسب با زمین انتخاب شده
            drawDynamicBorder();

            // ۳. خط کشش نشانه‌گیری (تیرکمانی معکوس برای شلیک مهارتی)
            if (isAiming) {
                ctx.beginPath();
                ctx.moveTo(player.x, player.y);
                ctx.lineTo(player.x + (dragStart.x - dragEnd.x), player.y + (dragStart.y - dragEnd.y));
                ctx.strokeStyle = "rgba(255, 235, 59, 0.6)"; ctx.lineWidth = 3; ctx.stroke();
            }

            // ۴. رسم تصاویر تیله‌های هدف کاربر (شعاع ۱۴)
            targets.forEach(t => {
                if (!t.isOut) {
                    if (imgTarget.complete && imgTarget.naturalWidth !== 0) {
                        ctx.drawImage(imgTarget, t.x - t.r, t.y - t.r, t.r * 2, t.r * 2);
                    } else {
                        ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI*2);
                        ctx.fillStyle = "red"; ctx.fill(); ctx.closePath();
                    }
                }
            });

            // ۵. رسم تصویر تیله دست بزرگ شما با فایل 6.png (شعاع ۲۴)
            if (imgPlayer.complete && imgPlayer.naturalWidth !== 0) {
                ctx.drawImage(imgPlayer, player.x - player.r, player.y - player.r, player.r * 2, player.r * 2);
            } else {
                ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
                ctx.fillStyle = "#00d2ff"; ctx.fill(); ctx.closePath();
            }

            requestAnimationFrame(gameLoop);
        }

        function getEventPos(e) {
            let r = canvas.getBoundingClientRect();
            let clientX = e.touches ? e.touches.clientX : e.clientX;
            let clientY = e.touches ? e.touches.clientY : e.clientY;
            return {
                x: (clientX - r.left) * (canvas.width / r.width),
                y: (clientY - r.top) * (canvas.height / r.height)
            };
        }

        function handleStart(e) {
            if (isMoving || shotsLeft <= 0) return;
            let pos = getEventPos(e);
            let d = Math.sqrt(Math.pow(pos.x - player.x, 2) + Math.pow(pos.y - player.y, 2));
            if (d < player.r + 35) { 
                isAiming = true; dragStart.x = pos.x; dragStart.y = pos.y;
                dragEnd.x = pos.x; dragEnd.y = pos.y; msgSlot.style.display = "none"; 
            }
        }

        function handleMove(e) { if (!isAiming) return; let pos = getEventPos(e); dragEnd.x = pos.x; dragEnd.y = pos.y; }
        function handleEnd() { if (!isAiming) return; isAiming = false; player.vx = (dragStart.x - dragEnd.x) * 0.11; player.vy = (dragStart.y - dragEnd.y) * 0.11; }

        canvas.addEventListener("mousedown", handleStart); canvas.addEventListener("mousemove", handleMove); window.addEventListener("mouseup", handleEnd);
        canvas.addEventListener("touchstart", function(e) { e.preventDefault(); handleStart(e); }, { passive: false });
        canvas.addEventListener("touchmove", function(e) { e.preventDefault(); handleMove(e); }, { passive: false });
        window.addEventListener("touchend", handleEnd);
    </script>
