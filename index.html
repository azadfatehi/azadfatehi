<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تیله بازی آنلاین محلی</title>
    <style>
        * { box-sizing: border-box; -webkit-user-select: none; user-select: none; font-family: Tahoma, Geneva, sans-serif; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0d19; color: #fff; }
        .screen-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; background: radial-gradient(circle, #1a1c2e 0%, #080911 100%); }
        .stadium-panel { width: 90%; max-width: 380px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; text-align: center; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { margin: 0 0 15px 0; font-size: 22px; color: #ffeb3b; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .input-group { margin-bottom: 12px; display: flex; flex-direction: column; text-align: right; }
        .input-group label { font-size: 12px; color: #aaa; margin-bottom: 4px; padding-right: 4px; }
        .input-group input, .input-group select { width: 100%; height: 42px; background: #121424; border: 1px solid #2c304d; border-radius: 10px; color: #fff; padding: 0 12px; font-size: 14px; text-align: center; outline: none; transition: 0.2s; }
        .input-group input:focus, .input-group select:focus { border-color: #ffeb3b; box-shadow: 0 0 8px rgba(255,235,59,0.2); }
        .action-btn { width: 100%; height: 46px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .primary-btn { background: linear-gradient(135deg, #ff9800 0%, #ff5722 100%); color: #fff; }
        .primary-btn:active { transform: scale(0.98); }
        .secondary-btn { background: #1c1e36; border: 1px solid #3d426b; color: #ffeb3b; }
        .p2p-box { background: rgba(33,150,243,0.1); border: 1px dashed #2196f3; border-radius: 12px; padding: 12px; margin-top: 12px; display: none; }
        .p2p-status { font-size: 13px; color: #e3f2fd; line-height: 1.6; }
        .p2p-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .p2p-grid button { height: 36px; font-size: 12px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; color: #fff; }
        .btn-host { background: #4caf50; } .btn-join { background: #00bcd4; }
        #gameCanvas { display: none; width: 100%; height: 100%; background: #05060a; }
    </style>
</head>
<body>
    <style>
        .game-top-bar { position: fixed; top: 0; left: 0; width: 100%; height: 50px; background: rgba(11,13,25,0.85); display: none; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px); z-index: 5; }
        .score-display { font-size: 13px; font-weight: bold; background: rgba(255,255,255,0.05); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .icon-btn { width: 36px; height: 36px; background: #1c1e36; border: 1px solid #3d426b; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #ffeb3b; font-size: 18px; }
        .drawer-panel { position: fixed; bottom: -100%; left: 0; width: 100%; max-height: 85%; background: #121424; border-top: 3px solid #ffeb3b; border-radius: 24px 24px 0 0; padding: 20px; transition: 0.3s ease-out; z-index: 20; color: #fff; direction: rtl; display: flex; flex-direction: column; overflow-y: auto; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
        .drawer-panel.open { bottom: 0; }
        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; z-index: 15; backdrop-filter: blur(3px); }
        .grid-select { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0 15px 0; }
        .grid-item { background: #1c1e36; border: 1px solid #2c304d; border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.15s; }
        .grid-item.active { background: #ffeb3b; color: #0b0d19; border-color: #ffeb3b; box-shadow: 0 4px 12px rgba(255,235,59,0.3); }
        .wheel-box { display: flex; flex-direction: column; align-items: center; margin-top: 10px; }
        .wheel-canvas { width: 160px; height: 160px; background: #1c1e36; border-radius: 50%; border: 4px solid #3d426b; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .players-wrap { margin-top: 10px; max-height: 150px; overflow-y: auto; background: rgba(0,0,0,0.15); padding: 8px; border-radius: 10px; }
        .player-row-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; background: rgba(255,255,255,0.02); padding: 6px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.03); }
        .player-inputs { display: flex; gap: 6px; width: 100%; align-items: center; }
        .order-badge { background: #3d426b; color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; white-space: nowrap; }
        .order-badge.assigned { background: #4caf50; }
        .toast-msg { position: fixed; top: 65px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #ffeb3b; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: bold; border: 1px solid rgba(255,235,59,0.3); z-index: 100; pointer-events: none; display: none; }
    </style>
    <!-- لایه اول: منوی ورود و ثبت‌نام اصلی استادیوم -->
    <div class="screen-layer" id="loginScreen">
        <div class="stadium-panel">
            <h2>🏟️ ورود به مسابقات تیله‌بازی</h2>
            <div class="input-group">
                <label>کد ملی بازیکن اصلی:</label>
                <input type="number" id="primaryNationalId" placeholder="۱۰ رقم کد ملی را وارد کنید">
            </div>
            <div class="input-group">
                <label>نام مستعار:</label>
                <input type="text" id="primaryUsername" placeholder="نام خود را بنویسید">
            </div>
            <button class="action-btn primary-btn" id="loginSubmitBtn">🎯 ثبت‌نام و ورود به زمین</button>
        </div>
    </div>

    <!-- لایه دوم: منوی چیدمان مسابقه و تنظیمات رادار -->
    <div class="screen-layer" id="setupMenu" style="display: none;">
        <div class="stadium-panel">
            <h2>🏆 تنظیمات استادیوم مسابقه</h2>
            <div class="input-group">
                <label>دوست داری چند نفره باشیم؟</label>
                <select id="playerCountSelect">
                    <option value="1">🎮 تک‌نفره (تست و تمرین فیزیک)</option>
                    <option value="2" selected>👥 ۲ نفره (رقابت محلی نوبتی)</option>
                    <option value="3">👥 ۳ نفره (آفلاین دورهمی)</option>
                    <option value="4">👥 ۴ نفره (آفلاین تیمی)</option>
                    <option value="online">📡 اتصال به گوشی‌های دیگر (رادار بی‌سیم)</option>
                </select>
            </div>

            <!-- کادر فرکانس رادار آفلاین -->
            <div class="p2p-box" id="p2pConnectionBox">
                <div class="p2p-status" id="p2pStatusText">دستگاه‌ها باید به یک هات‌اسپات متصل باشند.</div>
                <div class="p2p-grid">
                    <button class="btn-host" id="radarHostBtn">🏟️ ایجاد استادیوم</button>
                    <button class="btn-join" id="radarJoinBtn">⚡ اتصال سریع</button>
                </div>
            </div>

            <div class="input-group" style="margin-top:12px;">
                <label>تعداد تیله‌های هدف در مرکز زمین:</label>
                <select id="marbleCountSelect">
                    <option value="3">🔮 ۳ تیله مینیاتوری</option>
                    <option value="5" selected>🔮 ۵ تیله کلاسیک استاندارد</option>
                    <option value="7">🔮 ۷ تیله سنگین استادیوم</option>
                </select>
            </div>

            <button class="action-btn primary-btn" id="startBtn" style="margin-top:15px;">🎮 ورود مستقیم به مسابقه</button>
            <button class="action-btn secondary-btn" id="gearBtn" style="margin-top:8px;">⚙️ شخصی‌سازی پیشرفته استادیوم</button>
        </div>
    </div>
    <!-- لایه سوم: منوی کشویی پیشرفته شخصی‌سازی استادیوم -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <div class="drawer-panel" id="settingsDrawer">
        <h3 style="margin: 0 0 10px 0; color: #ffeb3b; text-align: center;">⚙️ شخصی‌سازی پیشرفته استادیوم</h3>
        
        <label style="font-size: 13px; color: #aaa;">🏟️ انتخاب جنس زمین مسابقه:</label>
        <div class="grid-select" id="groundGrid">
            <div class="grid-item active" data-val="classic">🏆 چوبی</div>
            <div class="grid-item" data-val="ice">❄️ یخی</div>
            <div class="grid-item" data-val="sand">⏳ شنی</div>
        </div>

        <label style="font-size: 13px; color: #aaa;">☁️ انتخاب وضعیت آب‌وهوای زمین:</label>
        <div class="grid-select" id="weatherGrid">
            <div class="grid-item active" data-val="sunny">☀️ آفتابی</div>
            <div class="grid-item" data-val="windy">💨 طوفانی</div>
            <div class="grid-item" data-val="rainy">🌧️ بارانی</div>
        </div>

        <label style="font-size: 13px; color: #aaa;">👥 اسامی بازیکنان و تعیین نوبت:</label>
        <div class="players-wrap" id="playersNamesContainer"></div>

        <div class="wheel-box" id="wheelSection" style="display: none;">
            <canvas class="wheel-canvas" id="orderWheelCanvas" width="160" height="160"></canvas>
            <button class="action-btn secondary-btn" id="drawOrderBtn" style="width: 170px; height: 36px; font-size: 13px; margin-top: 8px;">🎰 ببینیم نوبت اول کیه؟</button>
        </div>

        <button class="action-btn primary-btn" id="closeDrawerBtn" style="margin-top: 15px;">✅ عالی شد! بریم؟</button>
    </div>

    <!-- بار بالای صفحه اصلی مسابقه -->
    <div class="game-top-bar" id="gameHeader">
        <div class="score-display" id="playerTurnInfoText">نوبت: بارگذاری...</div>
        <div class="score-display" id="walletDisplay">🏦 بانک شما: ۱۰ تیله</div>
        <div class="icon-btn" id="stadiumExitBtn">🚪</div>
    </div>

    <!-- بنر اعلان‌های بازی -->
    <div class="toast-msg" id="gameToast">🎯 شلیک موفق!</div>

    <!-- بوم اصلی رندر گرافیک بازی -->
    <canvas id="gameCanvas"></canvas>

    <script>
        // --- هسته مرکزی متغیرها و دیتابیس لوکال استادیوم ---
        let audioCtx = null;
        let currentUsername = ""; let currentNationalId = ""; let totalMarblesOwned = 10;
        let playerNames = []; let playerNationalIds = []; let playerScores = [];
        let currentPlayerIndex = 0; let isQuickRandomMode = false;
        let gameLoopRunning = false;
        let localSocket = null; let isMyTurnOnline = true;
        let isFirstShotOfTurn = true; let currentLevel = 1; let isAiming = false; let isMoving = false;
        let hitSuccessInTurn = false; let targetOutInTurn = false; let hasBonusShot = false; let isChainMode = false;
        let dragStart = { x: 0, y: 0 }; let dragEnd = { x: 0, y: 0 };
        let windX = 0; let windY = 0; let selectedWeather = "sunny"; let weatherParticles = []; let windLines = [];
        let box = { x: 40, y: 60, w: 320, h: 220 };
        let player = { x: 200, y: 480, startX: 200, startY: 480, targetX: 200, targetY: 480, baseR: 22, r: 22, vx: 0, vy: 0, angle: 0, angleX: 0, angleY: 0, z: 0, progress: 0, arcHeight: 0, inAir: false }; 
        let targets = []; let selectedPlayerCount = 2; let playerOrders = [];

        const grounds = {
            classic: { friction: 0.98, fallbackColor: "#1b5e20", fallbackColorPlayer: "#2196f3" },
            ice: { friction: 0.995, fallbackColor: "#006064", fallbackColorPlayer: "#00e5ff" },
            sand: { friction: 0.94, fallbackColor: "#e65100", fallbackColorPlayer: "#ffeb3b" }
        };
        let selectedGroundVal = "classic"; let currentGround = grounds.classic;

        const canvas = document.getElementById("gameCanvas"); const ctx = canvas.getContext("2d");
        const loginScreen = document.getElementById("loginScreen"); const setupMenu = document.getElementById("setupMenu");
        const gameHeader = document.getElementById("gameHeader"); const settingsDrawer = document.getElementById("settingsDrawer");
        const drawerOverlay = document.getElementById("drawerOverlay"); const namesContainer = document.getElementById("playersNamesContainer");
        const startBtn = document.getElementById("startBtn"); const gearBtn = document.getElementById("gearBtn");
        const closeDrawer = document.getElementById("closeDrawerBtn"); const exitBtn = document.getElementById("stadiumExitBtn");

        // --- باز کردن قفل کارت صدای مرورگر برای دسکتاپ و اندروید ---
        function initAudio() { if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } if (audioCtx.state === 'suspended') { audioCtx.resume(); } }

        // --- رویداد کلیک ثبت‌نام و ورود اصلی ---
        document.getElementById("loginSubmitBtn").onclick = function() {
            initAudio();
            let uId = document.getElementById("primaryNationalId").value.trim();
            let uName = document.getElementById("primaryUsername").value.trim();
            if (uId.length !== 10 || uName === "") { alert("لطفاً اطلاعات را درست وارد کنید."); return; }
            currentNationalId = uId; currentUsername = uName;
            totalMarblesOwned = parseInt(localStorage.getItem(`marbles_${uId}`)) || 10;
            localStorage.setItem(`name_${uId}`, uName);
            loginScreen.style.display = "none"; setupMenu.style.display = "flex";
            updateWalletUI(); updateNameInputs(selectedPlayerCount);
        };

        function updateWalletUI() {
            let el = document.getElementById("walletDisplay");
            if (el) el.innerText = `🏦 بانک شما: ${totalMarblesOwned} تیله`;
        }
        function updateNameInputs(count) { 
            namesContainer.innerHTML = ""; 
            playerOrders = []; 
            const drawOrderBtn = document.getElementById("drawOrderBtn"); 
            const wheelSection = document.getElementById("wheelSection"); 
            let currentValidName = currentUsername || "بازیکن ۱"; 
            let mainRow = document.createElement("div"); 
            mainRow.className = "player-row-item"; 
            mainRow.innerHTML = `<div class="player-inputs"><input type="text" value="${currentValidName}" disabled><div class="order-badge assigned" id="mainPlayerBadge">نوبت ۱</div></div>`; 
            namesContainer.appendChild(mainRow); 
            playerOrders.push(1); 
            
            for(let i = 1; i < count; i++) { 
                playerOrders.push(i + 1); 
                let row = document.createElement("div"); 
                row.className = "player-row-item"; 
                row.innerHTML = `<div class="player-inputs"><input type="number" id="subId_${i}" placeholder="کد ملی بازیکن ${i + 1}" style="width:40%;"><input type="text" id="subName_${i}" placeholder="نام بازیکن ${i + 1}" style="width:40%;"><div class="order-badge" id="pBadge_${i}" style="width:20%; font-size:11px;">نامشخص</div></div>`; 
                namesContainer.appendChild(row); 
            } 
            
            if (count > 1) { 
                if(drawOrderBtn) drawOrderBtn.style.display = "block"; 
                if(wheelSection) wheelSection.style.display = "flex"; 
                setTimeout(() => { drawWheel(0); }, 50); 
            } else { 
                if(drawOrderBtn) drawOrderBtn.style.display = "none"; 
                if(wheelSection) wheelSection.style.display = "none"; 
            } 
        }

        function openSettingsDrawerMenu() {
            if (settingsDrawer) settingsDrawer.classList.add("open");
            if (drawerOverlay) drawerOverlay.style.display = "block";
        }

        function handleDrawerExit() {
            if (settingsDrawer) settingsDrawer.classList.remove("open");
            if (drawerOverlay) drawerOverlay.style.display = "none";
        }
        function saveSubPlayersData() {
            if (isQuickRandomMode || (typeof playerCountSelect !== 'undefined' && document.getElementById("playerCountSelect").value === "online")) return true; 
            let count = selectedPlayerCount;
            let currentValidName = currentUsername || "بازیکن ۱";
            let currentValidId = currentNationalId || "1111111111";
            let tempNames = [currentValidName]; playerNationalIds = [currentValidId]; 
            
            for (let i = 1; i < count; i++) {
                let subNameInput = document.getElementById(`subName_${i}`); 
                let subIdInput = document.getElementById(`subId_${i}`);
                let subName = subNameInput ? subNameInput.value.trim() : ""; 
                let subId = subIdInput ? subIdInput.value.trim() : "";
                
                if (subId === "" || subName === "") { 
                    alert(`لطفاً اطلاعات بازیکن شماره ${i + 1} را وارد کنید.`); 
                    return false; 
                }
                if (subId.length !== 10) { 
                    alert(`کد ملی بازیکن شماره ${i + 1} باید ۱۰ رقم باشد.`); 
                    return false; 
                }
                localStorage.setItem(`name_${subId}`, subName);
                if (localStorage.getItem(`marbles_${subId}`) === null) { 
                    localStorage.setItem(`marbles_${subId}`, 10); 
                }
                tempNames.push(subName); playerNationalIds.push(subId);
            }
            playerNames = tempNames; 
            return true;
        }

        startBtn.onclick = () => { 
            isQuickRandomMode = false; 
            if (selectedPlayerCount > 1 && !saveSubPlayersData()) return;
            if (selectedPlayerCount === 1) {
                playerNames = [currentUsername || "بازیکن ۱"];
                playerNationalIds = [currentNationalId || "1111111111"];
            }
            setupMenu.style.display = "none"; 
            launchGameDirectly(); 
        }; 

        function launchGameDirectly() {
            canvas.style.display = "block";
            gameHeader.style.display = "flex";
            playerScores = new Array(playerNames.length).fill(0);
            currentPlayerIndex = 0;
            initStadiumMatchSetup();
            if (!gameLoopRunning) { gameLoopRunning = true; gameLoop(); }
        }
        function initStadiumMatchSetup() {
            targets = [];
            let count = parseInt(selectedCountVal) || 5;
            let centerX = canvas.width / 2;
            let centerY = canvas.height / 2;
            
            // چیدمان دایره‌ای متقارن تیله‌های هدف در وسط زمین بازی
            for (let i = 0; i < count; i++) {
                let angle = (i * Math.PI * 2) / count;
                let radius = count > 5 ? 45 : 32;
                targets.push({
                    x: centerX + Math.cos(angle) * radius,
                    y: centerY + Math.sin(angle) * radius,
                    vx: 0, vy: 0, r: 15, isOut: false, angle: 0, angleX: 0, angleY: 0
                });
            }
            // تنظیم موقعیت اولیه تیله بازیکن اصلی
            player.x = canvas.width / 2;
            player.y = canvas.height - 100;
            player.startX = player.x; player.startY = player.y;
            player.targetX = player.x; player.targetY = player.y;
            player.vx = 0; player.vy = 0; player.inAir = false; player.progress = 0;
            updateTurnIndicatorText();
        }

        function updateTurnIndicatorText() {
            let el = document.getElementById("playerTurnInfoText");
            if (el && playerNames[currentPlayerIndex]) {
                el.innerText = `🎮 نوبت پرتاب: ${playerNames[currentPlayerIndex]}`;
            }
        }

        // رسم گرافیکی دایره قرعه‌کشی نوبت‌ها
        function drawWheel(angle) {
            const wCanvas = document.getElementById("orderWheelCanvas");
            if (!wCanvas) return;
            const wCtx = wCanvas.getContext("2d");
            wCtx.clearRect(0, 0, 160, 160);
            wCtx.save(); wCtx.translate(80, 80); wCtx.rotate(angle);
            
            let count = selectedPlayerCount;
            let slice = (Math.PI * 2) / count;
            let colors = ["#ff5722", "#2196f3", "#4caf50", "#9c27b0"];
            
            for (let i = 0; i < count; i++) {
                wCtx.beginPath(); wCtx.moveTo(0, 0);
                wCtx.arc(0, 0, 72, i * slice, (i + 1) * slice);
                wCtx.fillStyle = colors[i % colors.length]; wCtx.fill(); wCtx.lineWidth = 1.5;
                wCtx.strokeStyle = "#121424"; wCtx.stroke();
            }
            wCtx.restore();
            // رسم عقربه نشانگر قرعه‌کشی
            wCtx.beginPath(); wCtx.moveTo(80, 4); wCtx.lineTo(74, 16); wCtx.lineTo(86, 16); wCtx.closePath();
            wCtx.fillStyle = "#ffeb3b"; wCtx.fill();
        }
        document.getElementById("drawOrderBtn").onclick = function(e) { 
            e.preventDefault(); e.stopPropagation(); 
            initAudio(); 
            if(selectedPlayerCount > 1 && !saveSubPlayersData()) return; 
            playLaunchSound(); 
            let totalRotation = (Math.PI * 2 * 6) + (Math.random() * Math.PI * 2); 
            let startTimestamp = null; 
            
            function animateWheel(timestamp) { 
                if (!startTimestamp) startTimestamp = timestamp; 
                let progress = timestamp - startTimestamp; 
                let progressRatio = Math.min(progress / 2800, 1); 
                let currentAngle = (1 - Math.pow(1 - progressRatio, 4)) * totalRotation; 
                drawWheel(currentAngle); 
                
                if (progress < 2800) { 
                    requestAnimationFrame(animateWheel); 
                } else { 
                    let count = selectedPlayerCount; 
                    let sliceAngle = (Math.PI * 2) / count; 
                    let winningIndex = (count - Math.floor((totalRotation % (Math.PI * 2)) / sliceAngle)) % count; 
                    let mainBadge = document.getElementById("mainPlayerBadge"); 
                    if (mainBadge) mainBadge.innerText = `نوبت ${((0 - winningIndex + count) % count) + 1}`; 
                    
                    let tempPlayers = [{ name: currentUsername || "بازیکن ۱", id: currentNationalId, order: ((0 - winningIndex + count) % count) + 1 }]; 
                    for (let i = 1; i < count; i++) { 
                        let finalOrder = ((i - winningIndex + count) % count) + 1; 
                        let b = document.getElementById(`pBadge_${i}`); 
                        if(b) { b.innerText = `نوبت ${finalOrder}`; b.classList.add("assigned"); } 
                        tempPlayers.push({ name: document.getElementById("subName_" + i)?.value || `بازیکن ${i + 1}`, id: document.getElementById("subId_" + i)?.value || "", order: finalOrder }); 
                    } 
                    tempPlayers.sort((a, b) => a.order - b.order); 
                    playerNames = tempPlayers.map(p => p.name); 
                    playerNationalIds = tempPlayers.map(p => p.id); 
                    currentPlayerIndex = 0; updateTurnIndicatorText(); updateWalletUI(); 
                    showGameToast(`🎉 نوبت‌ها تعیین شد!`); 
                } 
            } 
            requestAnimationFrame(animateWheel); 
        };

        // --- مهندسی فرکانس‌های صوتی اختصاصی استادیوم ---
        function playLaunchSound() {
            try { initAudio(); let now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.type = "triangle"; osc.frequency.setValueAtTime(140, now);
                osc.frequency.exponentialRampToValueAtTime(480, now + 0.12);
                gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.15);
            } catch(e){}
        }

        function playClickSound(intensity = 0.5) { 
            try { initAudio(); let now = audioCtx.currentTime; let vol = Math.max(0.1, Math.min(intensity * 1.4, 1.1)); 
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.type = "sine";
                osc.frequency.setValueAtTime(2500 + (vol * 250), now); osc.frequency.exponentialRampToValueAtTime(1950, now + 0.012); 
                gain.gain.setValueAtTime(vol * 0.35, now); gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.025); 
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.03);
            } catch(e) {} 
        }
        function playCheeringSound() { 
            try { initAudio(); let now = audioCtx.currentTime; 
                for(let i=0; i<8; i++) {
                    let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.type = "triangle";
                    osc.frequency.setValueAtTime(280 + (i * 40), now); osc.frequency.linearRampToValueAtTime(460 + (i * 20), now + 1.2); 
                    gain.gain.setValueAtTime(0.18, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 1.4); 
                    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 1.4);
                } 
            } catch(e){} 
        }

        function playDisappointmentSound() { 
            try { initAudio(); let now = audioCtx.currentTime; 
                for(let i=0; i<6; i++) { 
                    let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.type = "sine";
                    osc.frequency.setValueAtTime(190 + (i * 12), now); osc.frequency.linearRampToValueAtTime(100 + (i * 4), now + 0.9); 
                    gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.95); 
                    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.95);
                } 
            } catch(e){} 
        }

        function playStadiumGoalHornSound() { playCheeringSound(); }
        function stopAmbientSound() {}

        function getEventPos(e) {
            let rect = canvas.getBoundingClientRect();
            let cx = e.touches ? e.touches[0].clientX : e.clientX;
            let cy = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (cx - rect.left) * (canvas.width / rect.width), y: (cy - rect.top) * (canvas.height / rect.height) };
        }

        function handleStart(e) {
            initAudio(); let pos = getEventPos(e);
            if (canvas.style.display === "block" && setupMenu.style.display === "none" && pos.x < 80 && pos.y < 80) {
                e.preventDefault(); openSettingsDrawerMenu(); return;
            }
            if (isMoving || player.inAir) return;
            isAiming = true; dragStart.x = pos.x; dragStart.y = pos.y; dragEnd.x = pos.x; dragEnd.y = pos.y;
            player.startX = player.x; player.startY = player.y;
        }

        function handleMove(e) { if (!isAiming) return; let pos = getEventPos(e); dragEnd.x = pos.x; dragEnd.y = pos.y; }
        function handleEnd() { 
            if (!isAiming) return; 
            isAiming = false; 
            player.vx = 0; player.vy = 0; 
            
            // 🎯 جهت طبیعی کشش پرتاب (مثل پرندگان خشمگین)
            let dx = dragEnd.x - dragStart.x; 
            let dy = dragEnd.y - dragStart.y; 
            let dragDist = Math.sqrt(dx * dx + dy * dy); 
            
            let activeTargets = targets.filter(t => !t.isOut).length;
            if (activeTargets === 0) {
                setTimeout(showFinalScoreboard, 100);
                return;
            }
            
            if (dragDist > 5) { 
                isMoving = true;
                player.startX = player.x; player.startY = player.y; 
                let targetHit = null; 
                let closestDist = Infinity; 
                targetOutInTurn = false;
                
                targets.forEach(t => { 
                    if (t.isOut) return; 
                    let A = dy; let B = -dx; 
                    let C = dx * player.y - dy * player.x; 
                    let lineDist = Math.abs(A * t.x + B * t.y + C) / Math.sqrt(A * A + B * B); 
                    if (lineDist < (16 + t.r)) { 
                        let dToTarget = Math.sqrt((t.x - player.x) ** 2 + (t.y - player.y) ** 2); 
                        if (dToTarget < closestDist) { 
                            closestDist = dToTarget; targetHit = t; 
                        } 
                    } 
                }); 
                if (targetHit && closestDist < 400) { 
                    player.arcHeight = 0; 
                    player.targetX = targetHit.x; player.targetY = targetHit.y; 
                    player.vx = Math.cos(Math.atan2(targetHit.y - player.y, targetHit.x - player.x)) * (7 + dragDist * 0.15); 
                    player.vy = Math.sin(Math.atan2(targetHit.y - player.y, targetHit.x - player.x)) * (7 + dragDist * 0.15); 
                    
                    setTimeout(() => { 
                        let hitSpeed = 7 + (dragDist * 0.15); 
                        playClickSound(hitSpeed / 10); 
                        let angle = Math.atan2(targetHit.y - player.startY, targetHit.x - player.startX); 
                        let steps = 0; 
                        let slideInterval = setInterval(() => { 
                            targetHit.x += Math.cos(angle) * (hitSpeed * 1.35); 
                            targetHit.y += Math.sin(angle) * (hitSpeed * 1.35); 
                            hitSpeed *= 0.88; steps++; 
                            if (targetHit.x < box.x || targetHit.x > box.x + box.w || targetHit.y < box.y || targetHit.y > box.y + box.h) { 
                                targetHit.isOut = true; targetOutInTurn = true; 
                                if (!isQuickRandomMode) { 
                                    if(playerScores[currentPlayerIndex] !== undefined) { playerScores[currentPlayerIndex]++; } else { playerScores[currentPlayerIndex] = 1; } 
                                    let id = playerNationalIds[currentPlayerIndex] || ""; 
                                    if (id === currentNationalId) { totalMarblesOwned++; } else if (id !== "") { 
                                        let cSubM = parseInt(localStorage.getItem(`marbles_${id}`)) || 0; localStorage.setItem(`marbles_${id}`, cSubM + 1); 
                                    } 
                                    updateWalletUI(); 
                                } 
                                if (targets.filter(targetItem => !targetItem.isOut).length === 0) { 
                                    clearInterval(slideInterval); setTimeout(showFinalScoreboard, 100); return; 
                                } 
                            } 
                            if (steps > 45 || hitSpeed < 0.2 || targetHit.isOut) { 
                                clearInterval(slideInterval); setTimeout(resetRound, 300); 
                            } 
                        }, 16); 
                    }, (closestDist / 5.5) * 15); 
                } else { 
                    let cX = player.x + dx * 6, cY = player.y + dy * 6; 
                    player.targetX = Math.max(box.x+22, Math.min(box.x+box.w-22, cX)); 
                    player.targetY = Math.max(box.y+22, Math.min(box.y+box.h-22, cY)); 
                    player.vx = dx * 0.15; player.vy = dy * 0.15; 
                    player.arcHeight = Math.min(dragDist * 0.5, 140); 
                } 
                if (!isQuickRandomMode && !targetHit) { 
                    if (player.targetX < box.x || player.targetX > box.x + box.w || player.targetY < box.y || player.targetY > box.y + box.h) { 
                        let id = playerNationalIds[currentPlayerIndex] || ""; 
                        if (id === currentNationalId && totalMarblesOwned > 0) { totalMarblesOwned--; } else if (id !== "") { 
                            let cSubM = parseInt(localStorage.getItem(`marbles_${id}`)) || 0; 
                            if(cSubM > 0) localStorage.setItem(`marbles_${id}`, cSubM - 1); 
                        } 
                        showGameToast("⚠️ جریمه خروج تیله خودی! ۱ تیله کسر شد."); 
                        updateWalletUI(); 
                    } 
                } 
                
                if (document.getElementById("playerCountSelect").value === "online" && localSocket && localSocket.readyState === WebSocket.OPEN) {
                    localSocket.send(JSON.stringify({
                        type: 'SHOOT', x: player.x, y: player.y, targetX: player.targetX, targetY: player.targetY, vx: player.vx, vy: player.vy, arcHeight: player.arcHeight
                    }));
                    isMyTurnOnline = false; 
                }
                
                try { playLaunchSound(); } catch(e){}
                player.progress = 0; player.inAir = true; isFirstShotOfTurn = false; 
            } 
        }

        canvas.addEventListener("mousedown", handleStart); canvas.addEventListener("mousemove", handleMove); canvas.addEventListener("mouseup", handleEnd);
        canvas.addEventListener("touchstart", handleStart, { passive: false }); canvas.addEventListener("touchmove", handleMove, { passive: false }); canvas.addEventListener("touchend", handleEnd, { passive: false });
        function setupGridSelector(gridId, activeClass, callback) { const grid = document.getElementById(gridId); if(!grid) return; grid.addEventListener('click', (e) => { const item = e.target.closest('[data-val]'); if(!item) return; grid.querySelectorAll('.' + activeClass).forEach(el => el.classList.remove(activeClass)); item.classList.add(activeClass); callback(item.getAttribute('data-val')); }); }
        setupGridSelector('groundGrid', 'active', (val) => { selectedGroundVal = val; currentGround = grounds[val]; });
        setupGridSelector('weatherGrid', 'active', (val) => { selectedWeather = val; if(val==='sunny'){windX=0;windY=0;} else if(val==='windy'){windX=0.08;windY=0.02;} else if(val==='rainy'){windX=0.03;windY=0.05;} else {windX=0.01;windY=0.02;} });

        function resetRound() {
            isMoving = false; player.vx = 0; player.vy = 0; player.z = 0; player.progress = 0; player.inAir = false; player.r = player.baseR;
            let activeTargets = targets.filter(t => !t.isOut).length;
            if (activeTargets === 0) { setTimeout(showFinalScoreboard, 200); return; }
            let nX = canvas.width / 2; let nY = canvas.height - 100; player.x = nX; player.y = nY; player.startX = nX; player.startY = nY; player.targetX = nX; player.targetY = nY;
            if (targetOutInTurn) { try { playCheeringSound(); } catch(e){} hasBonusShot = true; showGameToast("🎯 شلیک عالی! هوراااا"); } 
            else {
                try { playDisappointmentSound(); } catch(e){} showGameToast("😔 اوووف! نزدیک بود...");
                if (selectedPlayerCount > 1 && !isQuickRandomMode && !(document.getElementById("playerCountSelect").value === "online")) {
                    if (isChainMode || !targetOutInTurn) { isChainMode = false; currentPlayerIndex = (currentPlayerIndex + 1) % selectedPlayerCount; }
                    hasBonusShot = false;
                }
            }
            isFirstShotOfTurn = true; hitSuccessInTurn = false; targetOutInTurn = false; updateTurnIndicatorText();
        }

        function gameLoop() {
            if (canvas.style.display === "none") { gameLoopRunning = false; return; }
            gameLoopRunning = true;
            if (player.inAir) {
                player.progress += 0.03;
                player.x = player.startX + (player.targetX - player.startX) * player.progress + windX * player.progress * 15;
                player.y = player.startY + (player.targetY - player.startY) * player.progress + windY * player.progress * 15;
                player.z = Math.sin(player.progress * Math.PI) * player.arcHeight;
                player.r = player.baseR + player.z * 0.35;
                if (player.progress >= 1) {
                    player.x = player.targetX; player.y = player.targetY; player.z = 0; player.progress = 0; player.inAir = false; player.r = player.baseR;
                    let hitAny = false;
                    targets.forEach(t => {
                        if (!t.isOut) {
                            let dx = t.x - player.x, dy = t.y - player.y;
                            if (Math.sqrt(dx*dx + dy*dy) < (player.r + t.r)) {
                                hitAny = true; let hitSpeed = Math.sqrt(player.vx*player.vx + player.vy*player.vy) || 5.5;
                                playClickSound(hitSpeed / 5);
                                t.vx = Math.cos(Math.atan2(dy, dx)) * (hitSpeed * 1.35); t.vy = Math.sin(Math.atan2(dy, dx)) * (hitSpeed * 1.35);
                            }
                        }
                    });
                    if (!hitAny) { setTimeout(resetRound, 300); }
                }
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = currentGround.fallbackColor; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 🛠️ رسم و فیزیک حرکت تیله‌های هدف در وسط استادیوم
            targets.forEach(t => {
                if (!t.isOut) {
                    t.x += t.vx; t.y += t.vy; t.vx *= currentGround.friction; t.vy *= currentGround.friction;
                    if (t.x < box.x || t.x > box.x + box.w || t.y < box.y || t.y > box.y + box.h) {
                        t.isOut = true; targetOutInTurn = true;
                        if (targets.filter(targetItem => !targetItem.isOut).length === 0) { setTimeout(showFinalScoreboard, 100); return; }
                    }
                    ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.fillStyle = "#ff5722"; ctx.fill(); ctx.strokeStyle = "#fff"; ctx.stroke();
                }
            });

            // 🎯 رسم تیله بازیکن اصلی مسابقه
            ctx.beginPath(); ctx.arc(player.x, player.y - player.z, player.r, 0, Math.PI * 2);
            ctx.fillStyle = currentGround.fallbackColorPlayer || "#2196f3"; ctx.fill(); ctx.strokeStyle = "#fff"; ctx.stroke();

            // ⚙️ فعال‌سازی رویداد کلیک دکمه چرخ‌دنده تنظیمات منو
            let gBtn = document.getElementById("gearBtn");
            if (gBtn) {
                gBtn.onclick = function() { openSettingsDrawerMenu(); };
            }
            
            let cDrawer = document.getElementById("closeDrawerBtn");
            if (cDrawer) {
                cDrawer.onclick = function() { handleDrawerExit(); };
            }

            updateWeatherParticles(); drawWeather(); requestAnimationFrame(gameLoop);
        }

        // --- شبیه‌سازی افکت‌های ذرات اتمسفر آب‌وهوای زمین بازی ---
        function updateWeatherParticles() {} function drawWeather() {}
        function generateMenuPreviews() {}
        function resizeCanvas() { canvas.width = 400; canvas.height = 600; }
        document.getElementById("playerCountSelect").onchange = (e) => {
            let val = e.target.value;
            let pBox = document.getElementById("p2pConnectionBox");
            if (val === "online") {
                selectedPlayerCount = 2; 
                if (pBox) pBox.style.display = "block";
                updateNameInputs(1); 
            } else {
                selectedPlayerCount = parseInt(val);
                if (pBox) pBox.style.display = "none";
                updateNameInputs(selectedPlayerCount);
            }
        };

        // --- فرستنده‌ها و گیرنده‌های رادار محلی استادیوم بی‌سیم ---
        function initiateRadarHost() {
            document.getElementById("p2pStatusText").innerHTML = "🟢 استادیوم محلی ساخته شد.<br><span style='color:#fff; font-size:12px;'>کافیست حریف دکمه «اتصال سریع» را در گوشی خود بزند.</span>";
            showGameToast("🏟️ منتظر ورود بازیکنان...");
            setTimeout(() => {
                try {
                    localSocket = new WebSocket("ws://127.0.0.1:8080");
                    setupSocketListeners();
                } catch(e) {
                    console.log("خطا در سوکت میزبان");
                }
            }, 500);
        }

        function autoDiscoverAndConnect() {
            document.getElementById("p2pStatusText").innerText = "📡 در حال اسکن فرکانس‌های استادیوم حریف...";
            showGameToast("⏳ رادار در حال جستجو...");
            const commonGateways = ["192.168.43.1", "192.168.1.1", "192.168.0.1", "172.20.10.1", "10.0.0.1"];
            let foundHost = false;

            commonGateways.forEach((ip) => {
                if (foundHost) return;
                let tempSocket = new WebSocket(`ws://${ip}:8080`);
                tempSocket.onopen = () => {
                    if (!foundHost) {
                        foundHost = true;
                        localSocket = tempSocket;
                        setupSocketListeners();
                        document.getElementById("p2pStatusText").innerText = "✅ متصل شد! زمین مسابقه...";
                        showGameToast("⚡ استادیوم پیدا شد!");
                        let activeName = isQuickRandomMode ? "بازیکن مهمان" : (currentUsername || "بازیکن ۲");
                        localSocket.send(JSON.stringify({ type: 'GUEST_JOINED', guestName: activeName }));
                    }
                };
                tempSocket.onerror = () => { tempSocket.close(); };
            });

            setTimeout(() => {
                if (!foundHost) {
                    document.getElementById("p2pStatusText").innerHTML = "❌ حریف پیدا نشد!<br><span style='color:#ff9800; font-size:11px;'>مطمئن شوید به وای‌فای یا هات‌اسپات یکدیگر وصل هستید.</span>";
                }
            }, 4000);
        }

        let hostRadarBtn = document.getElementById("radarHostBtn");
        if(hostRadarBtn) hostRadarBtn.onclick = initiateRadarHost;
        
        let joinRadarBtn = document.getElementById("radarJoinBtn");
        if(joinRadarBtn) joinRadarBtn.onclick = autoDiscoverAndConnect;
        function setupSocketListeners() {
            localSocket.onopen = () => { console.log("اتصال سوکت محلی برقرار شد."); };
            localSocket.onmessage = (event) => {
                let data = JSON.parse(event.data);
                if (data.type === 'GUEST_JOINED') {
                    playerNames = [currentUsername || "بازیکن ۱", data.guestName];
                    selectedPlayerCount = 2;
                    showGameToast(`🎮 ${data.guestName} وارد استادیوم شد!`);
                    localSocket.send(JSON.stringify({
                        type: 'START_GAME', players: playerNames, ground: selectedGroundVal, weather: selectedWeather, marbles: selectedCountVal
                    }));
                    setTimeout(launchGameDirectly, 1000);
                }
                if (data.type === 'START_GAME') {
                    playerNames = data.players; selectedGroundVal = data.ground; currentGround = grounds[data.ground];
                    selectedWeather = data.weather; selectedCountVal = data.marbles; selectedPlayerCount = 2;
                    isMyTurnOnline = false; launchGameDirectly();
                }
                if (data.type === 'SHOOT') {
                    player.x = data.x; player.y = data.y; player.targetX = data.targetX; player.targetY = data.targetY;
                    player.vx = data.vx; player.vy = data.vy; player.arcHeight = data.arcHeight; player.inAir = true; isMyTurnOnline = true;
                }
            };
        }

        // 🏆 رندر و نمایش فیزیکی جدول کامل کارنامه پایان مسابقه
        function showFinalScoreboard() {
            let scoreboardDiv = document.getElementById("finalScoreboard");
            if (scoreboardDiv && scoreboardDiv.style.display === "flex") return;
            gameLoopRunning = false;
            
            let id = currentNationalId || "";
            if (id !== "") {
                localStorage.setItem(`marbles_${id}`, totalMarblesOwned);
                localStorage.setItem("totalMarblesOwned", totalMarblesOwned);
            }
            updateWalletUI();

            if (!scoreboardDiv) {
                scoreboardDiv = document.createElement("div");
                scoreboardDiv.id = "finalScoreboard";
                scoreboardDiv.style = "position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#161a36; color:white; padding:25px; border-radius:18px; box-shadow:0 0 25px rgba(0,0,0,0.7); z-index:10005; text-align:center; direction:rtl; font-family:Tahoma; width:300px; border:2px solid #ffeb3b;";
                document.body.appendChild(scoreboardDiv);
            }
            
            scoreboardDiv.style.display = "flex";
            scoreboardDiv.style.flexDirection = "column";
            scoreboardDiv.style.gap = "12px";
            
            let scoresHtml = `<h3 style="margin:0 0 10px 0; color:#ffeb3b; font-size:18px;">🏆 نتایج نهایی مسابقه</h3>`;
            playerNames.forEach((name, index) => {
                let score = playerScores[index] || 0;
                scoresHtml += `<div style="font-size:14px; background:rgba(255,255,255,0.05); padding:8px; border-radius:8px;">🏅 <b>${name}</b>: خروج <span style="color:#4caf50; font-weight:bold;">${score}</span> تیله</div>`;
            });
            
            scoresHtml += `<div style="margin:10px 0; font-size:15px; color:#00e676; font-weight:bold; border-top:1px dashed #444; padding-top:10px;">🏦 موجودی بانک شما: ${totalMarblesOwned} تیله</div>`;
            scoresHtml += `
                <div style="display:flex; gap:10px; margin-top:10px; justify-content:center;">
                    <button onclick="location.reload()" style="background:#4caf50; color:white; border:none; padding:10px 15px; border-radius:8px; cursor:pointer; font-weight:bold; flex:1; font-size:13px;">🔄 بازی مجدد</button>
                    <button onclick="handleFinalExit(); document.getElementById('finalScoreboard').style.display='none';" style="background:#f44336; color:white; border:none; padding:10px 15px; border-radius:8px; cursor:pointer; font-weight:bold; flex:1; font-size:13px;">🚪 خروج</button>
                </div>
            `;
            scoreboardDiv.innerHTML = scoresHtml;
        }

        function handleFinalExit() { 
            canvas.style.display = "none"; gameHeader.style.display = "none"; setupMenu.style.display = "none"; 
            if (settingsDrawer) settingsDrawer.classList.remove("open");
            if (drawerOverlay) drawerOverlay.style.display = "none";
            loginScreen.style.display = "flex"; gameLoopRunning = false; 
        }

        function showGameToast(msg) {
            let t = document.getElementById("gameToast"); if(!t) return;
            t.innerText = msg; t.style.display = "block";
            setTimeout(() => { t.style.display = "none"; }, 2500);
        }

        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();
    </script>
