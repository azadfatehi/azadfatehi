<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>تیله‌بازی</title>

    <!-- Manifest برای نصب روی موبایل -->
    <link rel="manifest" href="manifest.json">

    <!-- آیکون برنامه -->
    <link rel="apple-touch-icon" href="icon.png">

    <meta name="theme-color" content="#1a237e">

    <style>
        /* استایل‌های پایه */
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: sans-serif;
            direction: rtl;
        }

        /* صفحه لاگین */
        #loginScreen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, #1a237e, #020716);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }

        #loginBox {
            width: 90%;
            max-width: 380px;
            background: rgba(255,255,255,0.08);
            padding: 25px;
            border-radius: 18px;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        #loginBox input {
            width: 100%;
            padding: 14px;
            font-size: 20px;
            border-radius: 12px;
            border: none;
            margin-bottom: 18px;
            text-align: center;
        }

        .btn {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border-radius: 12px;
            font-size: 18px;
            border: none;
            cursor: pointer;
        }

        .btn-blue { background: #2962ff; color: #fff; }
        .btn-green { background: #00c853; color: #fff; }
        .btn-orange {
            background: transparent;
            border: 2px dashed #ff9100;
            color: #ff9100;
        }

        /* صفحه بازی */
        #canvas {
            display: none;
            width: 100%;
            height: 100%;
            background: #000;
        }
    </style>
</head>
<body>

<!-- صفحه لاگین -->
<div id="loginScreen">
    <div id="loginBox">
        <h2 style="color:white; margin-bottom:20px;">به میدان تیله‌بازی خوش آمدید</h2>

        <input id="playerName" placeholder="نام بازیکن">

        <button class="btn btn-blue" onclick="login()">ورود</button>
        <button class="btn btn-green" onclick="register()">ثبت‌نام</button>
        <button class="btn btn-orange" onclick="quickStart()">شروع سریع ⚡</button>
    </div>
</div>

<!-- بوم بازی -->
<canvas id="canvas"></canvas>
<script>
/* ---------------------------------------------------
   🟦 سیستم لاگین و ثبت‌نام
--------------------------------------------------- */

function login() {
    let name = document.getElementById("playerName").value.trim();

    if (name.length < 3) {
        alert("نام باید حداقل ۳ حرف باشد");
        return;
    }

    localStorage.setItem("playerName", name);
    startGame();
}

function register() {
    let name = document.getElementById("playerName").value.trim();

    if (name.length < 3) {
        alert("نام باید حداقل ۳ حرف باشد");
        return;
    }

    localStorage.setItem("playerName", name);
    alert("ثبت‌نام با موفقیت انجام شد!");
    startGame();
}

function quickStart() {
    let randomName = "بازیکن_" + Math.floor(Math.random() * 9000 + 1000);
    localStorage.setItem("playerName", randomName);
    startGame();
}

/* ---------------------------------------------------
   🟦 شروع بازی
--------------------------------------------------- */

function startGame() {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("canvas").style.display = "block";

    initGame();
}

/* ---------------------------------------------------
   🟦 بارگذاری تصاویر بازی
--------------------------------------------------- */

let imgPlayer = new Image();
imgPlayer.src = "1.png";

let imgBg = new Image();
imgBg.src = "grass.jpg";

/* ---------------------------------------------------
   🟦 متغیرهای اولیه بازی
--------------------------------------------------- */

let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;

canvas.width = W;
canvas.height = H;

let marbles = [];
let currentPlayerIndex = 0;
let gameLoopRunning = false;
let isShooting = false;

/* ---------------------------------------------------
   🟦 ساخت تیله‌ها
--------------------------------------------------- */

function initGame() {
    marbles = [];

    let playerName = localStorage.getItem("playerName") || "بازیکن";

    // ساخت یک تیله برای بازیکن
    marbles.push({
        x: W * 0.5,
        y: H * 0.5,
        vx: 0,
        vy: 0,
        radius: 22,
        owner: playerName
    });

    gameLoopRunning = true;
    gameLoop();
}
</script>
<script>
/* ---------------------------------------------------
   🟦 فیزیک حرکت تیله‌ها
--------------------------------------------------- */

function updatePhysics() {
    for (let m of marbles) {

        // حرکت
        m.x += m.vx;
        m.y += m.vy;

        // اصطکاک زمین
        m.vx *= 0.96;
        m.vy *= 0.96;

        // توقف کامل
        if (Math.abs(m.vx) < 0.05) m.vx = 0;
        if (Math.abs(m.vy) < 0.05) m.vy = 0;

        // برخورد با دیوارها
        if (m.x < m.radius) {
            m.x = m.radius;
            m.vx *= -0.7;
        }
        if (m.x > W - m.radius) {
            m.x = W - m.radius;
            m.vx *= -0.7;
        }
        if (m.y < m.radius) {
            m.y = m.radius;
            m.vy *= -0.7;
        }
        if (m.y > H - m.radius) {
            m.y = H - m.radius;
            m.vy *= -0.7;
        }
    }

    handleCollisions();
}

/* ---------------------------------------------------
   🟦 برخورد تیله‌ها با هم
--------------------------------------------------- */

function handleCollisions() {
    for (let i = 0; i < marbles.length; i++) {
        for (let j = i + 1; j < marbles.length; j++) {

            let a = marbles[i];
            let b = marbles[j];

            let dx = b.x - a.x;
            let dy = b.y - a.y;
            let dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < a.radius + b.radius) {

                // برخورد
                let angle = Math.atan2(dy, dx);
                let force = 0.5;

                a.vx -= Math.cos(angle) * force;
                a.vy -= Math.sin(angle) * force;

                b.vx += Math.cos(angle) * force;
                b.vy += Math.sin(angle) * force;
            }
        }
    }
}

/* ---------------------------------------------------
   🟦 کنترل شلیک با لمس
--------------------------------------------------- */

let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener("touchstart", e => {
    let t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
});

canvas.addEventListener("touchend", e => {
    let t = e.changedTouches[0];
    let dx = touchStartX - t.clientX;
    let dy = touchStartY - t.clientY;

    let power = Math.min(40, Math.sqrt(dx * dx + dy * dy) / 3);

    let m = marbles[0]; // تیله بازیکن

    m.vx = dx * 0.15;
    m.vy = dy * 0.15;
});

/* ---------------------------------------------------
   🟦 حلقه اصلی بازی
--------------------------------------------------- */

function gameLoop() {
    if (!gameLoopRunning) return;

    updatePhysics();
    drawGame();

    requestAnimationFrame(gameLoop);
}

/* ---------------------------------------------------
   🟦 رسم بازی
--------------------------------------------------- */

function drawGame() {
    ctx.clearRect(0, 0, W, H);

    // پس‌زمینه
    ctx.drawImage(imgBg, 0, 0, W, H);

    // تیله‌ها
    for (let m of marbles) {
        ctx.drawImage(imgPlayer, m.x - m.radius, m.y - m.radius, m.radius * 2, m.radius * 2);
    }
}
</script>
<!-- ---------------------------------------------------
     🟦 ثبت سرویس‌ورکر برای اجرای آفلاین + نصب روی موبایل
--------------------------------------------------- -->
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js")
        .then(() => console.log("Service Worker ثبت شد"))
        .catch(err => console.log("خطا در ثبت SW:", err));
}
</script>

</body>
</html>
